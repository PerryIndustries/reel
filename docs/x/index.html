<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Wire">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">

<title>Wire</title>
<link rel="stylesheet" href="../kit/base.css">
<style>
:root{
  --bg:#ffffff; --fg:#0f1419; --muted:#536471; --line:#eff3f4; --soft:#f7f9f9;
  --accent:#1d9bf0; --accent-fg:#ffffff; --heart:#f91880; --repost:#00ba7c; --link:#1d9bf0; --gold:#f5b50a;
  --font:-apple-system,"SF Pro Text","Segoe UI",system-ui,sans-serif;
  --display:-apple-system,"SF Pro Display","Segoe UI",system-ui,sans-serif;
  --bar:52px;
}
@media (prefers-color-scheme: dark){:root{
  --bg:#000000; --fg:#e7e9ea; --muted:#71767b; --line:#2f3336; --soft:#16181c;
  --accent:#1d9bf0; --accent-fg:#ffffff; --heart:#f91880; --repost:#00ba7c; --link:#1d9bf0; color-scheme:dark}}
.top{border-bottom:0}
.top .row{height:52px}
.logo-mark{width:30px;height:30px;flex:none;color:var(--fg)}
.logo-mark svg{width:30px;height:30px}
.ftabs{display:grid;grid-template-columns:repeat(2,1fr);border-bottom:1px solid var(--line);position:sticky;top:calc(52px + env(safe-area-inset-top,0px));background:var(--bg);z-index:9}
.ftabs button,.ftabs a{padding:14px 0 12px;text-align:center;font-weight:600;color:var(--muted);position:relative;display:block}
.ftabs .on{color:var(--fg);font-weight:700}
.ftabs .on::after{content:"";position:absolute;left:50%;bottom:0;width:56px;margin-left:-28px;height:4px;border-radius:2px;background:var(--accent)}
.ftabs.four{grid-template-columns:repeat(4,1fr)}
/* tweets */
.tweet{border-bottom:1px solid var(--line);padding:10px 16px 6px;position:relative}
.tweet.chain{border-bottom:0;padding-bottom:0}
.tweet.chain .tav::after{content:"";position:absolute;left:19px;top:44px;bottom:-10px;width:2px;background:var(--line)}
.tweet.reply{padding-top:8px}
.social{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:13px;font-weight:700;padding:0 0 4px 26px}
.social svg{width:16px;height:16px}
.trow{display:flex;gap:10px}
.tav{position:relative;flex:none;width:40px}
.tbody{flex:1;min-width:0}
.thead{display:flex;align-items:center;gap:4px;font-size:15px;line-height:1.3;min-width:0}
.thead b{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.thead .h{color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.thead .sp{flex:1}
.thead .dots{width:28px;height:28px;display:grid;place-items:center;color:var(--muted);flex:none;margin:-4px -6px -4px 0}
.thead .dots svg{width:18px;height:18px}
.replyto{color:var(--muted);font-size:14px;padding-top:2px}
.replyto b{color:var(--link);font-weight:400}
.ttext{padding-top:2px;white-space:pre-wrap;overflow-wrap:anywhere;font-size:15px;line-height:1.35}
.ttext.big{font-size:21px;line-height:1.3;padding-top:8px}
.ttext .tag{color:var(--link)}
.tmedia{margin-top:10px;border-radius:16px;overflow:hidden;border:1px solid var(--line);position:relative;background:var(--soft);display:grid;gap:2px}
.tmedia .pic{width:100%;height:100%}
.tmedia.g1{display:block}
.tmedia.g1 .pic{aspect-ratio:var(--ar,4/5);max-height:72vh}
.tmedia.g1 .pic img{object-fit:cover}
.tmedia.g2{grid-template-columns:1fr 1fr;aspect-ratio:7/4}
.tmedia.g3{grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;aspect-ratio:1}
.tmedia.g3 .pic:first-child{grid-row:span 2}
.tmedia.g4{grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;aspect-ratio:1}
.tmedia .pic{aspect-ratio:auto}
.tmedia .nsfwcover{background:rgba(0,0,0,.32)}
.tmedia .nsfwcover .tag{background:#fff;color:#000;border:0}
.quoted{margin-top:10px;border:1px solid var(--line);border-radius:16px;padding:10px 12px;display:block}
.quoted .thead{font-size:14px}
.quoted .ttext{font-size:14px}
.quoted .tmedia{margin-top:8px;border-radius:12px}
.quoted .tmedia.g1 .pic{max-height:260px}
.tbar{display:flex;align-items:center;justify-content:space-between;padding:8px 0 4px;margin-left:-6px;max-width:440px}
.tbar button,.tbar a{display:inline-flex;align-items:center;gap:4px;color:var(--muted);font-size:13px;padding:6px;border-radius:999px;font-variant-numeric:tabular-nums}
.tbar svg{width:19px;height:19px}
.tbar .on.like{color:var(--heart)}
.tbar .on.rt{color:var(--repost)}
.tbar .on.bm{color:var(--accent)}
.tbar .end{display:flex;gap:2px}
.tbar .end button{padding:6px 4px}
/* post page */
.detail{padding:12px 16px 4px;border-bottom:1px solid var(--line)}
.detail .who{display:flex;align-items:center;gap:10px}
.detail .who .n{flex:1;min-width:0;line-height:1.25}
.detail .who b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.detail .who .h{color:var(--muted);font-size:15px}
.detail .time{color:var(--muted);font-size:15px;padding:12px 0;border-bottom:1px solid var(--line)}
.detail .time b{color:var(--fg);font-weight:700}
.detail .counts{display:flex;gap:16px;flex-wrap:wrap;padding:12px 0;border-bottom:1px solid var(--line);font-size:14px;color:var(--muted)}
.detail .counts b{color:var(--fg)}
.detail .tbar{max-width:none;justify-content:space-around;margin:0}
.showmore{display:block;color:var(--link);font-size:14px;padding:10px 16px 12px 66px;border-bottom:1px solid var(--line);width:100%}
.loadmore{display:block;width:100%;text-align:center;padding:14px;color:var(--link);font-weight:600}
.reply-to{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted);padding:6px 16px 0}
.reply-to button{color:var(--link);font-weight:700}
/* profile */
.pbanner{height:130px;background:linear-gradient(120deg,#1d9bf0,#7856ff);position:relative;overflow:hidden}
.pbanner .pic{position:absolute;inset:0;height:100%}
.pbanner .pic img{object-fit:cover}
.pbanner .pic.nsfw img{filter:blur(18px) brightness(.8)}
.phead{display:flex;justify-content:space-between;align-items:flex-end;padding:0 16px;margin-top:-40px;position:relative}
.phead .av{border:4px solid var(--bg)}
.phead .btns{display:flex;gap:8px;padding-bottom:6px}
.phead .btn{width:auto;padding:7px 16px}
.pinfo{padding:10px 16px 0}
.pinfo h2{margin:0;font:800 20px var(--display);display:flex;align-items:center;gap:4px}
.pinfo .h{color:var(--muted);font-size:15px}
.pinfo .bio{padding-top:10px;white-space:pre-wrap;overflow-wrap:anywhere}
.pinfo .meta{display:flex;flex-wrap:wrap;gap:4px 14px;color:var(--muted);padding-top:10px;font-size:14px}
.pinfo .meta svg{width:16px;height:16px;vertical-align:-3px;margin-right:2px}
.pinfo .fol{display:flex;gap:16px;padding-top:10px;font-size:14px;color:var(--muted)}
.pinfo .fol b{color:var(--fg)}
.pinned{display:flex;align-items:center;gap:6px;color:var(--muted);font-size:13px;font-weight:700;padding:10px 16px 0 42px}
.pinned svg{width:14px;height:14px}
.mgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:2px}
.mgrid .pic{aspect-ratio:1}
.astrip{display:flex;gap:14px;overflow-x:auto;padding:10px 16px;scrollbar-width:none;border-bottom:1px solid var(--line)}
.astrip::-webkit-scrollbar{display:none}
.astrip button{display:flex;flex-direction:column;align-items:center;gap:4px;width:64px;flex:none;font-size:12px}
.astrip .ring{padding:2px;border:2px solid transparent;border-radius:50%}
.astrip .on .ring{border-color:var(--accent)}
.astrip .n{max-width:64px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.astrip .on .n{font-weight:700}
/* search */
.xsearch{flex:1;display:flex;align-items:center;gap:8px;background:var(--soft);border-radius:999px;padding:0 14px;height:40px}
.xsearch svg{width:18px;height:18px;color:var(--muted);flex:none}
.xsearch input{border:0;background:transparent;padding:0;height:40px;border-radius:0}
.xsearch input:focus-visible{outline:none}
.trend{display:block;padding:12px 16px;border-bottom:1px solid var(--line)}
.trend .k{color:var(--muted);font-size:13px}
.trend b{display:block;font-size:15px;padding:2px 0}
.trend .n{color:var(--muted);font-size:13px}
.prow{display:flex;align-items:center;gap:12px;padding:12px 16px;border-bottom:1px solid var(--line)}
.prow .who{flex:1;min-width:0}
.prow .who div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.prow .btn{width:auto;padding:6px 16px}
/* notifications */
.note{display:flex;gap:12px;padding:12px 16px;border-bottom:1px solid var(--line);align-items:flex-start}
.note.un{background:color-mix(in srgb,var(--accent) 7%,transparent)}
.note .ic{width:30px;flex:none;display:flex;justify-content:flex-end;padding-top:2px}
.note .ic svg{width:28px;height:28px}
.note .ic .like{color:var(--heart)}.note .ic .rt{color:var(--repost)}.note .ic .fol{color:var(--accent)}
.note .t{flex:1;min-width:0}
.note .avs{display:flex;gap:4px;padding-bottom:8px}
.note .q{color:var(--muted);padding-top:4px;font-size:14px;overflow-wrap:anywhere}
.note .th{width:44px;height:44px;border-radius:8px;overflow:hidden;background:var(--soft);flex:none}
.note .th img{width:100%;height:100%;object-fit:cover}
.chips{display:flex;gap:8px;overflow-x:auto;padding:10px 16px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:5px 12px 5px 5px;border:1px solid var(--line);font-weight:600;font-size:14px;flex:none}
.chip.on{border-color:var(--fg)}
.chip .cnt{background:var(--accent);color:#fff;font-size:11px;line-height:16px;min-width:16px;padding:0 4px;border-radius:999px;text-align:center}
.fab{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(var(--bar) + env(safe-area-inset-bottom,0px) + 16px);width:56px;height:56px;border-radius:50%;background:var(--accent);color:#fff;display:grid;place-items:center;box-shadow:0 4px 14px rgba(0,0,0,.25);z-index:8}
.fab svg{width:26px;height:26px}
.caught{text-align:center;padding:22px 16px 18px}
.bub.me span{background:var(--accent)}
</style>
</head>
<body>
<header class="top"><div class="row" id="top"></div></header>
<main id="view"></main>
<nav class="tabbar"><div class="row">
  <button type="button" data-tab="home" aria-label="Home"></button>
  <button type="button" data-tab="search" aria-label="Search"></button>
  <button type="button" data-tab="notifications" aria-label="Notifications"></button>
  <button type="button" data-tab="messages" aria-label="Messages"></button>
  <button type="button" data-tab="me" aria-label="Profile"></button>
</div></nav>
<div class="ptr" id="ptr"><i></i></div>
<div id="layer"></div>
<div class="toast" id="toast" hidden></div>

<script>
"use strict";
window.APP = { id: "wire", name: "Wire", db: "reel-wire", version: 5, defaults: { perDay: 6, maxFiles: 4, topComments: 12, followerScale: 2.2 }, postRoute: "p", roots: ["home", "search", "notifications", "messages", "me"], pullRoutes: ["home"], liveRoutes: ["home", "notifications"] };
</script>
<script src="../kit/core.js"></script>
<script>
"use strict";
// Bump with the CACHE name in sw.js; Settings shows it so you can tell which version the phone is running.
const APP_VERSION = 1;
/* ================= icons ================= */
const I = {
  home:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5V21h-6v-6H9v6H3z"/></svg>',

  searchOn:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m20 20-4.8-4.8"/></svg>',
  bell:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M6 16V11a6 6 0 0 1 12 0v5l1.5 2h-15z"/><path d="M10 21h4" stroke-linecap="round"/></svg>',
  bellOn:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 16V11a6 6 0 0 1 12 0v5l1.5 2h-15z"/><path d="M10 21h4" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>',
  mail:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/></svg>',
  mailOn:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M3 7.5V5h18v2.5l-9 6z"/><path d="M3 9.8 12 15.8 21 9.8V19H3z"/></svg>',
  person:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0z"/></svg>',
  personOn:'<svg viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0z"/></svg>',
  reply:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M20.5 11.5a8.5 8.5 0 0 1-12.6 7.4L3.5 20.5l1.6-4.2A8.5 8.5 0 1 1 20.5 11.5z"/></svg>',
  rt:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 2l4 4-4 4M21 6H8a4 4 0 0 0-4 4v2M7 22l-4-4 4-4M3 18h13a4 4 0 0 0 4-4v-2"/></svg>',
  heart:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M12 20.5s-8.5-5-8.5-11A4.8 4.8 0 0 1 12 6.6a4.8 4.8 0 0 1 8.5 2.9c0 6-8.5 11-8.5 11z"/></svg>',
  heartOn:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 20.5s-8.5-5-8.5-11A4.8 4.8 0 0 1 12 6.6a4.8 4.8 0 0 1 8.5 2.9c0 6-8.5 11-8.5 11z"/></svg>',
  views:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M5 20V10M12 20V4M19 20v-7"/></svg>',
  bm:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M5 3h14v18l-7-5-7 5z"/></svg>',
  bmOn:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M5 3h14v18l-7-5-7 5z"/></svg>',
  share:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v13M7 8l5-5 5 5M5 14v6h14v-6"/></svg>',
  dots:'<svg viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="1.8"/><circle cx="12" cy="12" r="1.8"/><circle cx="19" cy="12" r="1.8"/></svg>',
  gear:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>',
  plus:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>',
  pin:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M15 3l6 6-3 1-3 3 1 5-2 2-4-4-5 5-1-1 5-5-4-4 2-2 5 1 3-3z"/></svg>',
  cal:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>',
  eyeOff:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3l18 18M10.6 10.6a3 3 0 0 0 4.2 4.2M9.9 5.2A10.7 10.7 0 0 1 12 5c6.5 0 10 7 10 7a17.6 17.6 0 0 1-3.2 4.2M6.6 6.6C3.9 8.4 2 12 2 12s3.5 7 10 7c1.6 0 3-.4 4.3-1"/></svg>',
  check:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12 5 5 9-10"/></svg>',
  quote:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M4 16h5v-5H6a3 3 0 0 1 3-3V6a5 5 0 0 0-5 5zM14 16h5v-5h-3a3 3 0 0 1 3-3V6a5 5 0 0 0-5 5z"/></svg>',
};
// The mark: a wire bending through the square with a spark at its end.
const MARK = '<svg viewBox="0 0 64 64"><rect width="64" height="64" rx="16" fill="currentColor"/><path d="M12 46C22 46 26 22 38 22c6 0 6 8 12 8" fill="none" stroke="var(--bg)" stroke-width="5" stroke-linecap="round"/><circle cx="50" cy="30" r="5" fill="#1d9bf0"/></svg>';
APP.mark = MARK;
APP.handleStyle = a => "@" + handleOf(a);
APP.followersWord = "followers";
// About one post in three has no photo: a thought, a tease, a question to her followers.
APP.kindFor = (a, r) => r() < .33 ? "text" : "photo";
APP.decorate = (p, a, r) => { p.sensitive = p.files.length > 0; };
const verifiedOwner = a => !!a.verified || LEVEL[a.level] > 1;

/* ================= X-style numbers ================= */
// Likes, replies, reposts, views and bookmarks for one of her posts, growing over time, plus your own taps.
function stats(p){
  const e = engage(p), r = rng(p.seed ^ 0x6a09e667);
  const rtRate = .06 + r() * .18, bmRate = .04 + r() * .12;
  const q = fanItems(p).filter(x => x.type === "quote").length;
  return { likes: e.likes + (p.liked ? 1 : 0), replies: Math.max(e.comments, countTree(commentTree(p))), reposts: Math.round(e.likes * rtRate) + q + (p.reposted ? 1 : 0), quotes: q, views: Math.round(e.views * 2.6) + 12, bookmarks: Math.round(e.likes * bmRate) + (p.saved ? 1 : 0) };
}
// Fans' reposts and quote posts of one of her posts, and a fan's own post about her now and then. Seeded per post.
const fanCache = new Map();
function fanItems(p){
  const key = p.id + "|" + (p.aiQuotes || []).length + "|" + (p.aiFan || []).length + "|" + p.comTry;
  if (fanCache.has(key)) return fanCache.get(key);
  const a = acctOf(p), r = rng(p.seed ^ 0x3779b9), { L } = totals(p), reg = regularsOf(a);
  const fan = () => r() < .35 ? reg[Math.floor(r() * reg.length)] : Math.floor(r() * POOL);
  // now and then the repost or quote is one of the other accounts (its own rng, so the fans' picks stay as they were)
  const N = npcAccts(), self = a.npc ? N.indexOf(a) : -1, rn = rng((p.seed ^ 0x27d4eb2f) >>> 0);
  const who = () => { const b = fan(), x = rn(), y = rn(); if (N.length && x < .2){ let k = Math.floor(y * N.length); if (k === self) k = (k + 1) % N.length; if (k !== self) return POOL + k; } return b; };

  const last = t.msgs[t.msgs.length - 1];
  const seen = last && last.me ? (n && now() < n.seenAt ? "Sent" : "Seen") : "";
  const postRef = id => { const sp = S.posts.find(x => x.id === id); if (!sp) return ""; return `<a class="dmpost" href="#/p/${esc(sp.id)}"><div class="dmcard"><div class="dmch">${myAv(20, a)}<b>${esc(nameOf(a))}</b> <span class="muted">@${esc(handleOf(a))}</span></div>${sp.files[0] ? picBox(sp.files[0], "pic", { small: true }) : ""}<div class="dmcap">${esc(textOf(sp))}</div></div></a>`; };
  return t.msgs.map((m, k) => { const gap = k === 0 || m.at - t.msgs[k-1].at > H; return `${gap ? `<div class="dmtime">${esc(ago(m.at, true))}</div>` : ""}<div class="bub ${m.me ? "me" : ""}">${m.post && !m.me ? postRef(m.post) : ""}<span>${esc(m.text)}</span></div>`; }).join("") +
    (seen && !typing ? `<div class="dmseen">${seen}</div>` : "") + (typing ? `<div class="bub"><span class="typing"><i></i><i></i><i></i></span></div>` : "") + (n && now() > n.at + MIN && S.dmErr ? `<div class="hint" style="text-align:center;margin-top:10px">${esc(S.dmErr)}</div>` : "");
}
function dmThread(v, a, i){
  const f = acct(i);
  (S.misc.dmRead[a.id] ||= {})[i] = now(); saveMisc();
  setTop(`${backBtn}<a href="#/user/${i}" style="display:flex;align-items:center;gap:10px;flex:1;min-width:0">${acctAv(f, 32)}<h1 style="font-size:16px">${esc(f.name)}<div class="hint" style="font-weight:400">@${esc(f.handle)}</div></h1></a>`);
  v.innerHTML = `<div class="pad" style="padding-bottom:80px"><div class="dmhead">${acctAv(f, 86)}<b>${esc(f.name)}</b><div class="hint">@${esc(f.handle)} · ${fmt(f.followers)} followers</div>${f.bio ? `<div class="hint">${esc(f.bio)}</div>` : ""}</div><div id="dmmsgs">${dmMsgsHTML(a, i)}</div></div>
    <div class="cbox"><div class="row pad">${myAv(32, a)}<input type="text" id="dmin" placeholder="Start a new message" autocomplete="off"><button type="button" data-dmsend="${i}" data-acct="${esc(a.id)}">Send</button></div></div>`;
  setTimeout(() => window.scrollTo(0, document.body.scrollHeight), 0);
}
APP.dmRepaint = () => {
  const r = route();
  if (r.name === "messages" && r.b !== undefined && r.b !== ""){ const el = $("#dmmsgs"); if (!el) return; const a = accountById(r.a) || A(); const bottom = window.innerHeight + window.scrollY > document.body.scrollHeight - 120; el.innerHTML = dmMsgsHTML(a, +r.b); hydrate(el); (S.misc.dmRead[a.id] ||= {})[+r.b] = now(); if (bottom) window.scrollTo(0, document.body.scrollHeight); return; }
  if (["messages", "home"].includes(r.name)) safeRender();
};
setInterval(() => { const r = route(); if (r.name === "messages" && r.b) APP.dmRepaint(); }, 4e3);
// The bot's queue.
APP.views.queue = v => {
  setTop(`${backBtn}<h1>Scheduled</h1><a class="iconbtn" href="#/settings" aria-label="Settings">${I.gear}</a>`);
  v.innerHTML = `<div class="pad"><div class="card" style="margin-top:14px"><h3>The bot posts for you</h3><div class="hint">Every photo Reel fetched gets posted here by itself, between 9 AM and midnight, in sets of one to four; about one post in three is text only. Photos never posted here go first; after that, reposts in new combos. Posts you like, bookmark or reply to stay up; the rest come down after a while.</div><div class="hint" data-wstatus>${esc(writerLine())}</div></div></div>` +
    ownAccts().map(a => { const Q = queued(a.id), st = acctSet(a); return `<div class="pad"><div class="sect">@${esc(handleOf(a))}${st.on ? "" : " · off"}</div>
      ${st.on ? `<span class="lbl">Posts per day</span><div class="seg" style="margin:6px 0 10px">${[2,4,6,10,16].map(n => `<button type="button" data-perday="${n}" data-acct="${esc(a.id)}" aria-pressed="${st.perDay === n}">${n}</button>`).join("")}</div>
      <div class="hint">${photosOf(a.id).length} photos in Reel · ${live(a.id).length} up · ${Q.length} queued${Q.length ? ` · next ${esc(until(Q[0].publishAt))}` : ""}</div>
      ${Q.slice(0, 14).map(p => `<div class="qrow"><div class="th">${p.files[0] ? mediaTag(p.files[0], "", { small: true }) : `<span style="display:grid;place-items:center;height:100%;font-size:20px">💬</span>`}</div><div class="info"><div>${esc(textOf(p))}</div><div class="hint">${p.kind === "text" ? "text post" : (isVideo(p.files[0].mime) ? "video" : p.files.length + (p.files.length === 1 ? " photo" : " photos"))} · ${esc(until(p.publishAt))}${p.cycled ? " · repost" : p.files.length ? " · new" : ""}</div></div><button class="btn" type="button" data-postnow="${esc(p.id)}">Post now</button></div>`).join("")}` : `<button class="btn" type="button" data-acton="${esc(a.id)}">Let @${esc(handleOf(a))} post here</button>`}</div>`; }).join("");
};
APP.views.settings = v => {
  setTop(`${backBtn}<h1>Settings</h1>`);
  v.innerHTML = `<div class="pad form">
    <a class="btn" href="../">Back to Reel</a>
    <div class="card"><h3>Accounts</h3><div class="hint">Reel's accounts post here with their own photos. Pick which ones, and how often.${npcAccts().length ? ` Reel's ${npcAccts().length} other accounts post here too, as other people.` : ""}</div>
      ${ownAccts().map(a => { const st = acctSet(a); return `<button type="button" class="toggle ${st.on ? "on" : ""}" data-acton="${esc(a.id)}"><span style="display:flex;align-items:center;gap:10px;min-width:0">${myAv(32, a)}<span style="min-width:0"><b>@${esc(handleOf(a))}</b><div class="hint">${photosOf(a.id).length} photos in Reel${photosOf(a.id).length ? "" : " (open Reel to fetch some)"} · ${st.on ? `about ${st.perDay} a day` : "not posting here"}</div></span></span><span class="sw"></span></button>${st.on ? `<div class="seg">${[2,4,6,10,16].map(n => `<button type="button" data-perday="${n}" data-acct="${esc(a.id)}" aria-pressed="${st.perDay === n}">${n}/day</button>`).join("")}</div>` : ""}`; }).join("")}
    </div>
    <div class="card"><h3>Content</h3>
      <button type="button" class="toggle ${blurOn() ? "on" : ""}" data-blur><span><b>Sensitive media warning</b><div class="hint">Photos stay hidden behind a warning until you tap Show.</div></span><span class="sw"></span></button>
      <button class="btn" type="button" data-newworld>New set of fans</button>
      <div class="hint">New names and pictures for everyone who replies, quotes and messages. Your posts and likes stay.</div></div>
    <div class="card"><h3>Writer</h3><div class="hint">Ollama on your PC writes the posts, replies, quotes and her answers, with the address and style Reel uses. When the PC is off, the built-in lines fill in.</div><div class="status" data-wstatus>${esc(writerLine())}</div>${PC() ? `<div class="hint">PC style version ${esc(String(PC().ver))}.</div>` : ""}<button class="btn" type="button" data-rewrite>Rewrite every post</button></div>
    <div class="card"><h3>Storage</h3><div class="hint" id="sstore">Checking…</div><button class="btn danger" type="button" data-reset>Erase everything Wire made on this phone</button><div class="hint">Reel's photos and accounts are never touched.</div></div>
    <div class="hint ver">Wire version ${APP_VERSION}</div>
  </div>`;
  if (navigator.storage?.estimate) navigator.storage.estimate().then(e => { const el = $("#sstore"); if (el) el.textContent = `${(e.usage/1048576).toFixed(0)} MB used on this phone (shared with Reel). ${S.posts.length} posts across ${LIB.accounts.length} ${LIB.accounts.length === 1 ? "account" : "accounts"}.`; });
};
function postMenu(id){
  const p = S.posts.find(x => x.id === id); if (!p) return;
  const a = acctOf(p);
  sheet(`${a.npc ? "" : `<button class="opt" data-o="pin">${I.pin} ${p.pinned ? "Unpin from profile" : "Pin to your profile"}</button>`}
    <button class="opt" data-o="save">${p.saved ? I.bmOn : I.bm} ${p.saved ? "Remove bookmark" : "Bookmark"}</button>
    ${p.files.length ? `<button class="opt" data-o="reveal">${I.eyeOff} ${revealed.has(p.id) || !blurOn() ? "Media is shown" : "Show the media"}</button>` : ""}
    <button class="opt" data-o="retext">${I.quote} New text</button>
    ${p.publishAt > now() ? `<button class="opt" data-o="now">${I.plus} Post now</button>` : ""}
    <button class="opt red" data-o="del">${I.dots} Delete post</button>`, async el => {
      const b = el.closest("[data-o]"); if (!b) return; const o = b.dataset.o;
      if (o === "del"){ if (b.dataset.armed !== "1"){ b.dataset.armed = "1"; b.textContent = "Tap again to delete"; return; } closeSheet(); await delPost(p); toast("Deleted. Its photos come back later."); if (route().name === "p") history.back(); else render(); return; }
      closeSheet();
      if (o === "pin"){ const was = p.pinned; for (const x of live(a.id)) if (x.pinned){ x.pinned = 0; await savePost(x); } p.pinned = was ? 0 : now(); await savePost(p); toast(p.pinned ? "Pinned to your profile" : "Unpinned"); render(); }
      if (o === "save"){ p.saved = !p.saved; await savePost(p); toast(p.saved ? "Added to your Bookmarks" : "Removed from Bookmarks"); render(); }
      if (o === "reveal"){ revealed.add(p.id); render(); }
      if (o === "retext"){ p.textTry = (p.textTry || 0) + 1; p.text = ""; p.textWritten = !ollamaURL(); await savePost(p); toast(ollamaURL() ? "Writing new text" : "New text"); writerRun(); render(); }
      if (o === "now"){ p.publishAt = now(); await savePost(p); toast("Posted"); render(); }
    });
}
const repaintCard = p => { const el = document.querySelector(`[data-post="${CSS.escape(p.id)}"]`); if (!el || route().name === "p") { render(); return; } const soc = el.querySelector(".social"); el.outerHTML = tweetCard(p, { social: soc ? soc.outerHTML : "" }); const n = document.querySelector(`[data-post="${CSS.escape(p.id)}"]`); hydrate(n); };
APP.onClick = async (t, d) => {
  if (d.tab === "home"){ if (route().name !== "home") go("#/"); refreshFeed(); return; }
  if (d.tab === "messages"){ go("#/messages/" + (ownAccts().find(a => dmUnreadCount(a)) || A()).id); return; }
  if (d.tab){ go("#/" + d.tab); return; }
  if (d.like){ const p = S.posts.find(x => x.id === d.like); if (!p) return; p.liked = !p.liked; p.kept = true; await savePost(p); repaintCard(p); return; }
  if (d.bookmark){ const p = S.posts.find(x => x.id === d.bookmark); if (!p) return; p.saved = !p.saved; await savePost(p); toast(p.saved ? "Added to your Bookmarks" : "Removed from Bookmarks"); repaintCard(p); return; }
  if (d.repost){ const p = S.posts.find(x => x.id === d.repost); if (!p) return; p.reposted = !p.reposted; p.kept = true; await savePost(p); toast(p.reposted ? "Reposted" : "Repost removed"); repaintCard(p); return; }
  if (d.fanlike){ const m = (S.misc.fanLikes ||= {}); m[d.fanlike] = !m[d.fanlike]; await saveMisc(); const y = window.scrollY; render(); window.scrollTo(0, y); return; }
  if ("share" in d){ toast("Link copied"); return; }
  if (d.postmenu){ postMenu(d.postmenu); return; }
  if (d.fanmenu){ sheet(`<button class="opt" data-h="hide">${I.eyeOff} Not interested in this post</button>`, async el => { if (!el.closest("[data-h]")) return; closeSheet(); toast("Thanks. You'll see fewer posts like this."); }); return; }
  if (d.expand){ expanded.add(d.expand); const y = window.scrollY; render(); window.scrollTo(0, y); return; }
  if (d.loadmore){ shownTop[d.loadmore] = (shownTop[d.loadmore] || 6) + 8; const y = window.scrollY; render(); window.scrollTo(0, y); return; }
  if (d.clike && d.p){ const p = S.posts.find(x => x.id === d.p); if (!p) return; p.cVotes = { ...(p.cVotes || {}), [d.clike]: !(p.cVotes || {})[d.clike] }; p.kept = true; await savePost(p); const y = window.scrollY; render(); window.scrollTo(0, y); return; }
  if (d.cmenu){ const p = S.posts.find(x => x.id === d.p); if (!p) return; const mine = (p.thread || []).find(x => x.id === d.cmenu && x.mine); sheet(`<button class="opt" data-h="hide">${I.eyeOff} ${mine ? "Delete my reply" : "Hide this reply"}</button>`, async el => { if (!el.closest("[data-h]")) return; closeSheet(); if (mine) p.thread = p.thread.filter(x => x.id !== d.cmenu && x.parent !== d.cmenu); else p.hiddenC = [...(p.hiddenC || []), d.cmenu]; treeCache.clear(); await savePost(p); render(); }); return; }
  if (d.reply !== undefined){ replyTo = { p: route().a, id: d.reply, handle: d.handle }; render(); const i = $("#cin"); if (i) i.focus(); return; }
  if ("cancelreply" in d){ replyTo = null; render(); return; }
  if (d.addc){ const i = $("#cin"); const text = i && i.value.trim(); if (!text) return; const p = S.posts.find(x => x.id === d.addc); if (!p) return; const parent = replyTo && replyTo.p === p.id ? replyTo.id : ""; replyTo = null; await ownerReply(p, parent, text); if (parent) expanded.add(parent.split(".")[0]); render(); toast("Your reply was sent"); return; }
  if (d.follow !== undefined){ followMap()[+d.follow] = !isFollowing(+d.follow); await saveMisc(); render(); return; }
};
// A search typed as a route (from a trend) lands in the box.
const _search = APP.views.search;
APP.views.search = (v, r) => { if (r.a !== undefined && r.a !== "") searchQ = r.a; _search(v, r); };
boot();
