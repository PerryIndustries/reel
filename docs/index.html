<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Reel">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<title>Reel</title>
<style>
:root{
  --bg:#ffffff; --fg:#0f0f12; --muted:#737380; --line:#e6e6ea; --soft:#f3f3f6;
  --accent:#ff5a36; --accent-fg:#ffffff; --heart:#ff3040; --link:#3b6cf6;
  --font:-apple-system,"SF Pro Text","Segoe UI",system-ui,sans-serif;
  --display:-apple-system,"SF Pro Display","Segoe UI",system-ui,sans-serif;
  --bar:52px;
}
@media (prefers-color-scheme: dark){:root{
  --bg:#000000; --fg:#f4f4f6; --muted:#a0a0ab; --line:#26262b; --soft:#141417;
  --accent:#ff7350; --accent-fg:#160803; --heart:#ff3b55; --link:#7c9cff; color-scheme:dark}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
html{height:100%}
body{min-height:100%}
body{background:var(--bg);color:var(--fg);font:15px/1.4 var(--font);overscroll-behavior-y:none}
[hidden]{display:none!important}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
a{color:inherit;text-decoration:none}
html{touch-action:manipulation;-webkit-text-size-adjust:100%}
input,textarea,select{font:inherit;font-size:16px;color:var(--fg);background:var(--soft);border:1px solid var(--line);border-radius:10px;padding:10px 12px;width:100%;min-width:0}
textarea{min-height:90px;resize:vertical}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.muted{color:var(--muted)}
.small{font-size:13px}
.num{font-variant-numeric:tabular-nums}

/* app chrome */
.top{position:sticky;top:0;z-index:10;background:var(--bg);padding-top:env(safe-area-inset-top,0px);border-bottom:1px solid var(--line)}
.top .in{height:48px;display:flex;align-items:center;gap:10px;padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px))}
.top h1{font:700 19px var(--display);margin:0;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top h1.logo{font:800 26px var(--display);letter-spacing:-.03em}
.top h1 button{font:inherit;display:inline-flex;align-items:center;gap:4px}
.top h1 button svg{width:16px;height:16px}
.iconbtn{width:36px;height:36px;display:grid;place-items:center;border-radius:50%}
.iconbtn svg{width:24px;height:24px}
main{padding-bottom:calc(var(--bar) + env(safe-area-inset-bottom,0px) + 20px);max-width:640px;margin:0 auto}
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:10;background:var(--bg);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
.tabbar .in{height:var(--bar);display:grid;grid-template-columns:repeat(5,1fr);max-width:640px;margin:0 auto}
.tabbar button{display:grid;place-items:center;position:relative}
.tabbar svg{width:26px;height:26px}
.tabbar .dot{position:absolute;top:10px;left:calc(50% + 8px);width:8px;height:8px;border-radius:50%;background:var(--heart)}
.tabbar .me{width:28px;height:28px;border-radius:50%;overflow:hidden;border:2px solid transparent}
.tabbar .on .me{border-color:var(--fg)}
.pad{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* avatars */
.av{border-radius:50%;overflow:hidden;display:grid;place-items:center;flex:none;color:#fff;font-weight:700;background:var(--soft)}
.av img{width:100%;height:100%;object-fit:cover}
.av.s24{width:24px;height:24px;font-size:11px}.av.s28{width:28px;height:28px;font-size:12px}.av.s32{width:32px;height:32px;font-size:13px}.av.s44{width:44px;height:44px;font-size:17px}.av.s62{width:62px;height:62px;font-size:24px}.av.s86{width:86px;height:86px;font-size:34px}
.ring{padding:2px;border-radius:50%;background:conic-gradient(from 200deg,#ffb23f,#ff5a36,#d6249f,#6a5cff,#ffb23f);display:inline-block;line-height:0}
.ring.seen{background:var(--line)}
.ring.none{background:transparent}
.ring>.av{border:2px solid var(--bg)}
.check{display:inline-grid;place-items:center;width:15px;height:15px;border-radius:50%;background:#3b8cf6;color:#fff;vertical-align:-2px;margin-left:3px}
.check svg{width:10px;height:10px}

/* stories tray */
.tray{display:flex;gap:14px;overflow-x:auto;padding-block:10px;border-bottom:1px solid var(--line);scrollbar-width:none}
.tray::-webkit-scrollbar{display:none}
.st{display:flex;flex-direction:column;align-items:center;gap:4px;width:72px;flex:none;font-size:12px}
.st span.n{max-width:72px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.astrip .st{width:60px}
.astrip .ring{padding:2px;background:transparent;border:2px solid transparent}
.astrip .st.on .ring{border-color:#3897f0}
.astrip .st.on .n{font-weight:700}
.astrip .allav{width:44px;height:44px;border:2px solid var(--bg);box-shadow:0 0 0 1px var(--line);border-radius:50%;display:grid;place-items:center}
.astrip .allav svg{width:22px;height:22px}

/* feed post */
.post{border-bottom:1px solid var(--line);padding-bottom:10px}
.phead{display:flex;align-items:center;gap:10px;padding:10px 0}
.phead .who{flex:1;min-width:0}
.phead b{font-weight:600}
.carousel{position:relative;background:var(--soft)}
.slides{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none}
.slides::-webkit-scrollbar{display:none}
.slide{flex:0 0 100%;scroll-snap-align:center;display:grid;place-items:center;background:#000;position:relative}
.slide img,.slide video{width:100%;max-height:75vh;object-fit:contain;display:block;aspect-ratio:var(--ar,4/5)}
.slide img{opacity:0;transition:opacity .25s ease}
.slide img.in{opacity:1}
.ptr{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 58px);width:34px;height:34px;margin-left:-17px;border-radius:50%;background:var(--bg);box-shadow:0 2px 10px rgba(0,0,0,.18);display:grid;place-items:center;z-index:9;opacity:0;pointer-events:none;transform:scale(.6)}
.ptr i{width:18px;height:18px;border-radius:50%;border:2.5px solid var(--line);border-top-color:var(--fg)}
.ptr.spin i{animation:ptrspin .7s linear infinite}
@keyframes ptrspin{to{transform:rotate(360deg)}}
.mute{position:absolute;right:10px;bottom:10px;width:30px;height:30px;border-radius:50%;background:rgba(0,0,0,.6);color:#fff;display:grid;place-items:center}
.mute svg{width:16px;height:16px}
.count{position:absolute;top:10px;right:10px;background:rgba(0,0,0,.6);color:#fff;font-size:12px;padding:3px 8px;border-radius:999px}
.dots{display:flex;justify-content:center;gap:4px;padding-top:8px;min-height:14px}
.dots i{width:6px;height:6px;border-radius:50%;background:var(--line)}
.dots i.on{background:var(--link)}
.burst{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none}
.burst svg{width:96px;height:96px;color:#fff;filter:drop-shadow(0 4px 14px rgba(0,0,0,.4));animation:pop .8s ease-out forwards}
@keyframes pop{0%{transform:scale(.2);opacity:0}20%{transform:scale(1.15);opacity:1}40%{transform:scale(.95)}80%{opacity:1}100%{transform:scale(1);opacity:0}}
.pbar{display:flex;align-items:center;gap:14px;padding-top:6px}
.pbar .sp{flex:1}
.pbar button{display:flex;align-items:center;gap:5px;font-weight:600;font-size:14px}
.pbar svg{width:26px;height:26px}
.pbar .liked{color:var(--heart)}
.likes{font-weight:600;margin-top:6px;display:block;text-align:left}
.caption{margin-top:4px;white-space:pre-wrap;overflow-wrap:anywhere}
.caption b{font-weight:600}
.morec{display:block;margin-top:4px;color:var(--muted)}
.when{margin-top:4px;color:var(--muted);font-size:12px}
.clamp{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}

/* profile */
.prof{padding-top:14px}
.prow{display:flex;align-items:center;gap:22px}
.pstats{flex:1;display:grid;grid-template-columns:repeat(3,1fr);text-align:center}
.pstats button{display:flex;flex-direction:column;align-items:center}
.pstats b{font-size:17px;font-weight:700}
.pstats span{font-size:13px}
.pname{font-weight:600;margin-top:12px}
.pbio{white-space:pre-wrap;overflow-wrap:anywhere;margin-top:2px}
.plink{color:var(--link);font-weight:500}
.pbtns{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:6px;margin-top:12px}
.btn{background:var(--soft);border-radius:9px;padding:8px 12px;font-weight:600;font-size:14px;text-align:center;display:block;width:100%}
.btn.primary{background:var(--accent);color:var(--accent-fg)}
.btn.blue{background:#3b8cf6;color:#fff}
.btn.danger{color:var(--heart)}
.ptabs{display:grid;grid-template-columns:repeat(3,1fr);margin-top:14px;border-bottom:1px solid var(--line)}
.ptabs button{padding:10px;display:flex;justify-content:center;align-items:center;gap:4px;color:var(--muted);border-bottom:1px solid transparent;margin-bottom:-1px}
.ptabs button.on{color:var(--fg);border-bottom-color:var(--fg)}
.ptabs svg{width:24px;height:24px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:2px}
.tile{position:relative;aspect-ratio:3/4;max-width:100%;overflow:hidden;background:var(--soft);display:block;width:100%}
.tile.tall{aspect-ratio:9/16}
.tile img,.tile video{width:100%;height:100%;object-fit:cover;display:block}
.tile .ic{position:absolute;top:6px;right:6px;color:#fff;filter:drop-shadow(0 1px 2px rgba(0,0,0,.6))}
.tile .ic svg{width:18px;height:18px}
.tile .views{position:absolute;left:6px;bottom:6px;color:#fff;font-size:12px;font-weight:600;display:flex;align-items:center;gap:3px;filter:drop-shadow(0 1px 2px rgba(0,0,0,.7))}
.tile .views svg{width:13px;height:13px}

/* lists */
.list .row{display:flex;align-items:center;gap:12px;padding:8px 0}
.list .row .who{flex:1;min-width:0}
.list .row .who div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.list .row .btn{width:auto;padding:6px 14px}
.cmt{display:flex;gap:12px;padding:10px 0}
.cmt .body{flex:1;min-width:0}
.cmt .t{white-space:pre-wrap;overflow-wrap:anywhere}
.cmt .meta{display:flex;gap:14px;margin-top:4px;font-size:12px;color:var(--muted)}
.cmt .h{display:grid;justify-items:center;color:var(--muted);font-size:11px;padding-top:4px}
.cmt .h svg{width:14px;height:14px}
.cbox{position:fixed;left:0;right:0;bottom:calc(var(--bar) + env(safe-area-inset-bottom,0px));background:var(--bg);border-top:1px solid var(--line);z-index:9}
.cbox .in{display:flex;gap:10px;align-items:center;padding-block:8px;max-width:640px;margin:0 auto}
.cbox input{border-radius:999px}
.cbox button{color:var(--link);font-weight:600}

/* activity */
.act{display:flex;gap:12px;align-items:center;padding:9px 0}
.act .t{flex:1;min-width:0;overflow-wrap:anywhere}
.act .thumb{width:44px;height:44px;flex:none;background:var(--soft);border-radius:4px;overflow:hidden}
.act .thumb img,.act .thumb video{width:100%;height:100%;object-fit:cover}
.sect{font-weight:700;font-size:16px;padding-top:16px;padding-bottom:4px}

/* forms */
.form{display:flex;flex-direction:column;gap:14px;padding-top:16px}
.field{display:flex;flex-direction:column;gap:6px}
.field label,.lbl{font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.hint{font-size:13px;color:var(--muted)}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:6px}
.seg button{border:1px solid var(--line);border-radius:9px;padding:9px 4px;font-weight:600;font-size:13px}
.seg button[aria-pressed="true"]{border-color:var(--accent);color:var(--accent)}
.card{border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:10px}
.card h3{margin:0;font:700 16px var(--display)}
.code{font-family:ui-monospace,Menlo,monospace;font-size:12px;background:var(--soft);border-radius:8px;padding:8px 10px;overflow-wrap:anywhere;user-select:all}
.thumbs{display:flex;gap:6px;flex-wrap:wrap}
.thumbs .th{width:72px;height:72px;border-radius:8px;overflow:hidden;background:var(--soft)}
.thumbs img,.thumbs video{width:100%;height:100%;object-fit:cover}
.status{font-size:13px;color:var(--muted);min-height:18px}
.progress{height:4px;border-radius:2px;background:var(--soft);overflow:hidden}
.progress i{display:block;height:100%;background:var(--accent);width:0;transition:width .2s}
.qrow{display:flex;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.qrow .th{width:56px;height:56px;border-radius:6px;overflow:hidden;background:var(--soft);flex:none}
.qrow .th img,.qrow .th video{width:100%;height:100%;object-fit:cover}
.qrow .info{flex:1;min-width:0}
.qrow .info div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.qrow .btn{width:auto;padding:6px 10px;font-size:13px}
.arow{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line);width:100%;text-align:left}
.arow .who{flex:1;min-width:0}
.empty{text-align:center;padding:56px 24px;color:var(--muted)}
.empty h2{color:var(--fg);font:700 20px var(--display);margin:0 0 6px}
.empty .btn{display:inline-block;width:auto;margin-top:16px;padding:10px 18px}

/* sheet + toast */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:60;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:640px;max-height:90%;overflow:auto;border-radius:16px 16px 0 0;padding-block:8px calc(16px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column}
.sheet .grab{width:38px;height:4px;border-radius:2px;background:var(--line);margin:4px auto 10px}
.sheet .opt{padding:14px 0;text-align:left;font-size:16px;border-bottom:1px solid var(--line)}
.sheet .opt:last-child{border-bottom:0}
.sheet .opt.red{color:var(--heart)}
.sheet h3{margin:0 0 4px;font:700 17px var(--display)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--bar) + env(safe-area-inset-bottom,0px) + 70px);background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:999px;font-weight:600;font-size:14px;z-index:80;max-width:calc(100% - 32px);text-align:center}

/* full-screen viewers (stories, reels) */
.full{position:fixed;inset:0;background:#000;color:#fff;z-index:50}
.sv .media{position:absolute;inset:0}
.sv .media img,.sv .media video{width:100%;height:100%;object-fit:cover}
.sv .shade{position:absolute;inset:0;background:linear-gradient(rgba(0,0,0,.45),transparent 18%,transparent 75%,rgba(0,0,0,.5));pointer-events:none}
.sv .bars{position:absolute;top:calc(env(safe-area-inset-top,0px) + 8px);left:8px;right:8px;display:flex;gap:3px}
.sv .bar{flex:1;height:2.5px;background:rgba(255,255,255,.35);border-radius:2px;overflow:hidden}
.sv .bar i{display:block;height:100%;background:#fff;width:0}
.sv .hd{position:absolute;top:calc(env(safe-area-inset-top,0px) + 20px);left:12px;right:8px;display:flex;align-items:center;gap:8px;font-size:14px}
.sv .hd .sp{flex:1}
.sv .hd .x{width:36px;height:36px;display:grid;place-items:center;color:#fff}
.sv .hd .x svg{width:26px;height:26px}
.sv .txt{position:absolute;left:20px;right:20px;top:60%;text-align:center;pointer-events:none}
.sv .txt span{font:800 25px/1.55 var(--display);background:#fff;color:#000;padding:2px 10px;-webkit-box-decoration-break:clone;box-decoration-break:clone;border-radius:6px}
.sv .taps{position:absolute;inset:80px 0 90px;display:grid;grid-template-columns:1fr 2fr}
.sv .ft{position:absolute;left:12px;right:12px;bottom:calc(env(safe-area-inset-bottom,0px) + 14px);display:flex;gap:10px;align-items:center}
.sv .ft .reply{flex:1;border:1px solid rgba(255,255,255,.6);border-radius:999px;padding:10px 14px;color:rgba(255,255,255,.85);font-size:14px}
.sv .ft .seen{display:flex;flex-direction:column;align-items:flex-start;gap:2px;font-size:13px;font-weight:600}
.sv .ft svg{width:26px;height:26px;color:#fff}
.rv{overflow-y:auto;scroll-snap-type:y mandatory;scrollbar-width:none}
.rv::-webkit-scrollbar{display:none}
.rv .r{position:relative;height:100vh;height:100dvh;scroll-snap-align:start;scroll-snap-stop:always}
.rv video{width:100%;height:100%;object-fit:cover}
.rv .side{position:absolute;right:10px;bottom:calc(env(safe-area-inset-bottom,0px) + 90px);display:flex;flex-direction:column;gap:18px;align-items:center;font-size:12px;font-weight:600}
.rv .side button,.rv .side a{display:flex;flex-direction:column;align-items:center;gap:3px;color:#fff}
.rv .side svg{width:30px;height:30px}
.rv .side .liked{color:var(--heart)}
.rv .info{position:absolute;left:14px;right:70px;bottom:calc(env(safe-area-inset-bottom,0px) + 22px);text-shadow:0 1px 3px rgba(0,0,0,.7)}
.rv .info .u{display:flex;align-items:center;gap:8px;font-weight:600;margin-bottom:6px}
.rv .shade{position:absolute;inset:0;background:linear-gradient(transparent 60%,rgba(0,0,0,.55));pointer-events:none}
.rv .close{position:fixed;top:calc(env(safe-area-inset-top,0px) + 10px);left:10px;z-index:2;width:40px;height:40px;display:grid;place-items:center;color:#fff}
.rv .close svg{width:28px;height:28px}
@media (prefers-reduced-motion:reduce){.burst svg{animation:none;opacity:0}.slide img{transition:none}}
.spec{border-bottom:8px solid var(--line)}
.dmicon{position:relative}.dmicon svg{width:24px;height:24px}
.cnt{position:absolute;top:0;right:-2px;background:var(--heart);color:#fff;font-size:10px;line-height:16px;min-width:16px;padding:0 4px;border-radius:999px;text-align:center}
.chips{display:flex;gap:8px;overflow-x:auto;padding-top:10px;padding-bottom:10px;scrollbar-width:none}
.chip{position:relative;display:flex;align-items:center;gap:6px;padding:5px 12px 5px 5px;border:1px solid var(--line);border-radius:999px;flex:none;font-size:14px;font-weight:600}
.chip.on{border-color:var(--fg)}
.chip .cnt{position:static;margin-left:2px}
.dmrow{display:flex;align-items:center;gap:12px;padding:8px 0}
.dmrow .who{flex:1;min-width:0}
.dmrow .un{font-weight:700;color:var(--fg)}
.clamp1{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.udot{width:9px;height:9px;border-radius:50%;background:var(--link);flex:none}
.dmhead{display:flex;flex-direction:column;align-items:center;gap:4px;padding:18px 0 22px;text-align:center}
.dmtime{text-align:center;color:var(--muted);font-size:12px;margin:14px 0 6px}
.bub{max-width:75%;margin:3px 0;display:flex;flex-direction:column;align-items:flex-start}
.bub span{background:var(--soft);padding:9px 13px;border-radius:20px;white-space:pre-wrap;overflow-wrap:anywhere}
.bub.me{margin-left:auto;align-items:flex-end}
.bub.me span{background:#3d5afe;color:#fff}
.dmstory{margin-bottom:4px}.dmstory img,.dmstory video{width:120px;height:200px;object-fit:cover;border-radius:12px;display:block;margin-top:3px}
.cmt.reply{padding:2px 0 8px 44px}
.byc{display:inline-flex;align-items:center;gap:3px;color:var(--muted)}.byc svg{width:11px;height:11px;color:var(--heart)}
.link{color:var(--link)}
.hls{display:flex;gap:16px;overflow-x:auto;padding:14px 0 4px;scrollbar-width:none}
.hlb{display:flex;flex-direction:column;align-items:center;gap:5px;width:66px;flex:none;font-size:12px}
.hlc{width:64px;height:64px;border-radius:50%;overflow:hidden;border:1px solid var(--line);padding:2px;background:var(--bg)}
.hlc img,.hlc video{width:100%;height:100%;object-fit:cover;border-radius:50%;display:block}
.hlb .n{max-width:66px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ins{color:var(--link);font-size:13px;font-weight:600;margin-top:6px;padding:0}
.igrid{display:grid;grid-template-columns:repeat(4,1fr);text-align:center;margin:6px 0 14px}
.igrid b{display:block;font-size:18px}.igrid span{font-size:12px;color:var(--muted)}

  get: (st,k) => DB.tx(st,"readonly",s=>s.get(k)),

// Mixes up what an account has queued: same posting times, different files in them.
async function shuffleQueue(a){

const urls = new Map();
async function mediaURL(key){
  if (!key) return "";

async function playableBlob(blob, mime){ return new Blob([await blob.arrayBuffer()], { type: blob.type || mime || "video/mp4" }); }

function wireVideoFallback(vd, key, mime){
  if (vd.dataset.fb) return; vd.dataset.fb = "1";
  vd.addEventListener("error", async () => {
    if (vd.dataset.fb === "2"){
      const box = vd.parentElement; if (box && !box.querySelector(".verr")) box.insertAdjacentHTML("beforeend", `<div class="verr">This video can't play here${vd.error ? " (error " + vd.error.code + ")" : ""}</div>`);

    vd.dataset.fb = "2";

  });

    const tk = key + "_th";
    if (await DB.get("media", tk)) return tk;

    while (Date.now() - lastInteract < 1500) await new Promise(r => setTimeout(r, 500));

document.addEventListener("load", e => { const el = e.target; if (el.tagName !== "IMG") return; noteDims(el, el.naturalWidth, el.naturalHeight); el.classList.add("in"); }, true);

async function hydrate(root){
  for (const el of root.querySelectorAll("video[data-media]:not([data-th]):not([data-media^='url:'])")){
    el.dataset.th = "1";
    videoThumb(el.dataset.media).then(async tk => {

      else el.poster = tu;

  const put = (el, u) => {
    if (!u || el.getAttribute("src")) return;

    if (el.tagName === "VIDEO") wireVideoFallback(el, el.dataset.media, el.dataset.mime);
  };

  const later = [];

    if (el.getAttribute("src")) continue;

    if (hit){ el.classList.add("in"); put(el, hit); } else later.push(el);
  }
  await Promise.all(later.map(async el => put(el, await mediaURL(el.dataset.media))));

function dmThreads(a){

  if (dmCache.has(key)) return dmCache.get(key);

  for (let d = Math.floor(start / D); d <= Math.floor(now() / D); d++){
    const r = rng(hashStr("dm" + a.seed + "|" + d));
    const n = Math.round(perDay * (.6 + r() * .8));
    for (let k = 0; k < n; k++){
      const t = d * D + r() * D; const i = Math.floor(r() * POOL);
      const st = stories.find(x => x.publishAt <= t && t < x.publishAt + D);
      const rp = rng(hashStr("dmp" + a.seed + "|" + d + "|" + k));
      const recent = posted.filter(x => x.publishAt <= t && t - x.publishAt < 7*D);
      if (st && r() < .35) add(i, { me:false, text: pick(DM_STORY, r), at: t, story: st.id });
      else if (recent.length && rp() < .4) add(i, { me:false, text: pick(DM_POST, rp), at: t, post: recent[Math.floor(rp() * Math.min(3, recent.length))].id });
      else add(i, { me:false, text: pick(DM_OPEN, r), at: t });
      if (r() < .35) add(i, { me:false, text: pick(DM_FOLLOW, r), at: t + (1 + r() * 40) * 60e3 });
      if (r() < .3){
        const t2 = t + (10 + r() * 170) * 60e3; add(i, { me:true, text: pick(DM_OWNER, r), at: t2 });
        if (r() < .6) add(i, { me:false, text: pick(DM_BACK, r), at: t2 + (2 + r() * 25) * 60e3 });

    const a = takers.slice().sort((x,y) => load(x) - load(y))[0];

function events(a){
  const ev = []; const who = `<b>${esc(handleOf(a))}</b>`;
  for (const p of live(a.id).slice(0, 15)){
    const e = engage(p); const f = p.files[0];
    for (const c of visibleComments(p).filter(c=>!c.mine).slice(-4)) ev.push({ at:c.at, acct:c.acct, html:`<b>${esc(acct(c.acct).handle)}</b> commented on ${who}'s post: ${esc(c.text)}`, p, f });
    { const fb = Math.round(followBump(p, a) * curve(now() - p.publishAt, 5*H)); if (fb > 0){ const rr = rng(p.seed ^ 0x51ed27); const i = Math.floor(rr()*POOL); ev.push({ at: Math.min(now(), p.publishAt + (20 + rr()*90)*60e3), acct:i, html: fb > 1 ? `<b>${esc(acct(i).handle)}</b> and ${full(fb-1)} others started following ${who} after their ${isVideo(f.mime) && p.files.length===1 ? "reel" : "post"}.` : `<b>${esc(acct(i).handle)}</b> started following ${who}.`, follow:i, own:a }); } }
    if (e.likes > 2){ const s = likerSample(p, 2); ev.push({ at: Math.min(now(), p.publishAt + 25*60e3), acct:s[0], html:`<b>${esc(acct(s[0]).handle)}</b>, <b>${esc(acct(s[1]).handle)}</b> and ${full(e.likes-2)} others liked ${who}'s ${isVideo(f.mime) && p.files.length===1 ? "reel" : "post"}.`, p, f }); }
  }
  for (const p of activeStories(a.id)){ const s = storyStats(p); if (s.likes > 1){ const l = likerSample(p, 1)[0]; ev.push({ at: Math.min(now(), p.publishAt + 15*60e3), acct:l, html:`<b>${esc(acct(l).handle)}</b> and ${full(s.likes-1)} others liked ${who}'s story.`, p, f:p.files[0], story:true }); } }
  const r = rng(hashStr("ev"+Math.floor(now()/D)+a.seed));
  for (let d=0; d<10; d++) for (let k=0; k<3; k++){ const t = now() - d*D - r()*D; const i = Math.floor(r()*POOL); if (t > (a.startedAt||0)) ev.push({ at:t, acct:i, html:`<b>${esc(acct(i).handle)}</b> started following ${who}.`, follow:i, own:a }); }
  return ev.filter(e => e.at <= now());
}
const allEvents = () => S.accounts.flatMap(events).sort((x,y) => y.at - x.at).slice(0, 120);
const unseen = () => S.accounts.some(a => live(a.id).length) && allEvents().some(e => e.at > (S.seenAt.all||0));

  const groups = [["New", e => e.at > seen], ["Today", e => now()-e.at < D], ["This week", e => now()-e.at < 7*D], ["Earlier", () => true]];
  const used = new Set(); let html = "";
  for (const [label, test] of groups){
    const g = ev.filter(e => !used.has(e) && test(e)); g.forEach(e => used.add(e));

  }
  v.innerHTML = `<div class="pad">${html}</div>`;
}

// Every video file in every account's folder, posted or still queued, once each.
function allVideos(){
  const seen = new Set(), out = [];
  for (const p of S.posts) for (const f of p.files || []) if (isVideo(f.mime) && !seen.has(f.key) && !String(f.key).startsWith("url:")){ seen.add(f.key); out.push({ key: f.key, mime: f.mime, post: p }); }
  return out;
}
let reelGrid = [], reelShown = 0, reelIO = null;

  const V = allVideos();

  if (r.a) openReels(R, r.a);

function recycleOrder(V){

}

/* ================= carousel, autoplay, gestures ================= */
function wireCarousels(root){
  for (const c of root.querySelectorAll(".carousel")){
    const sl = c.querySelector(".slides"), cnt = c.querySelector(".count"), dots = c.parentElement.querySelectorAll(".dots i");
    sl.addEventListener("scroll", () => {
      const i = Math.round(sl.scrollLeft / sl.clientWidth);
      if (cnt) cnt.textContent = (i+1)+"/"+sl.children.length;
      dots.forEach((d,k) => d.classList.toggle("on", k===i));
    }, { passive:true });
    let lastTap = 0;
    c.addEventListener("click", e => {
      if (e.target.closest("[data-mute]")) return;
      const t = now();
      if (t - lastTap < 320){ likePost(c.dataset.dbl, true); const b = document.createElement("div"); b.className = "burst"; b.innerHTML = I.heartOn; c.appendChild(b); setTimeout(() => b.remove(), 900); }
      lastTap = t;
    });
  }
}
let feedMuted = true, autoIO = null;
// A post counts as seen once it has been mostly on screen for a second. The time is refreshed on every
// later look, so the home feed can recycle the posts seen longest ago instead of always opening on the same ones.
let seenIO = null, seenSave = 0;
function wireSeen(root){
  if (seenIO) seenIO.disconnect();
  const timers = new Map();
  seenIO = new IntersectionObserver(es => es.forEach(en => {
    const id = en.target.dataset.post; if (!id || now() - (S.postSeen[id] || 0) < 10*60e3) return;
    if (en.isIntersecting) timers.set(id, setTimeout(() => { S.postSeen[id] = now(); clearTimeout(seenSave); seenSave = setTimeout(saveMisc, 1500); }, 1000));
    else { clearTimeout(timers.get(id)); timers.delete(id); }
  }), { threshold: .5 });
  root.querySelectorAll("article.post[data-post]").forEach(el => seenIO.observe(el));
}
function wireAutoplay(root){
  if (autoIO) autoIO.disconnect();
  autoIO = new IntersectionObserver(es => es.forEach(en => { const v = en.target; v.dataset.want = en.isIntersecting ? "1" : "0"; if (en.isIntersecting){ v.muted = feedMuted; v.play().catch(()=>{}); } else v.pause(); }), { threshold: .6 });
  root.querySelectorAll("video[data-auto]").forEach(v => autoIO.observe(v));
}

}

    if (draft.mode === "at" || draft.mode === "back"){ at = new Date(draft.at).getTime(); if (!at){ toast("Pick a date and time"); return; } }
    const p = { id: uid("p_"), source:"local", acct:a.id, files: draft.files, caption: draft.caption.trim(), captionManual: !!draft.caption.trim(), createdAt: now(), publishAt: at, seed: hashStr(uid("s")), order: 0, myComments: [], hidden: [] };
    await savePost(p); await autoCaptions();
    if (at < (a.startedAt || now())){ a.startedAt = at - 3*D; await saveAccounts(); }
    draft = { files: [], caption:"", mode:"now", at:"" };
    toast(at <= now() ? "Shared" : "Queued for "+until(at));
    go(at <= now() ? "#/" : "#/me/queue"); return;
  }
  if (d.savepost){
    const p = S.posts.find(x=>x.id===d.savepost); const a = accountById(p.acct) || A();
    const cap = $("#ecap").value.trim(); if (cap !== p.caption){ p.caption = cap; p.captionManual = true; p.captionAuto = false; } p.location = $("#eloc").value.trim();
    const w = new Date($("#ewhen").value).getTime(); if (w) p.publishAt = w;
    const l = $("#elikes").value, c = $("#ecom").value;
    p.likesTarget = l === "" ? undefined : Math.max(0, +l); p.commentsTarget = c === "" ? undefined : Math.max(0, +c);
    if (p.publishAt && p.publishAt < (a.startedAt||now())){ a.startedAt = p.publishAt - 3*D; await saveAccounts(); }
    await savePost(p); genCache.clear(); toast("Saved"); history.back(); return;
  }
  if (d.delpost){ if (d.armed !== "1"){ d.armed = "1"; t.textContent = "Tap again to delete"; return; } deletePost(S.posts.find(x=>x.id===d.delpost)); return; }
  if ("saveprofile" in d){
    const P = A();
    P.name = $("#pn").value.trim(); P.handle = $("#ph").value.trim().replace(/^@/,"").replace(/\s+/g,"").toLowerCase();
    P.bio = $("#pb").value; P.link = $("#pl").value.trim();
    P.growth = Math.max(0, +$("#pg").value || 0); P.following = Math.max(0, +$("#pfo").value || 0); P.verified = $("#pv").checked;
    const want = Math.max(0, +$("#pf").value || 0);
    P.followers = Math.round(P.followers + want - followersNow(P));
    await saveAccounts(); toast("Profile saved"); history.back();
    return;
  }
  if ("delacc" in d){
    if (d.armed !== "1"){ d.armed = "1"; t.textContent = "Tap again to remove this account"; return; }
    const gone = A();
    for (const p of S.posts.filter(p => p.acct === gone.id)){ await DB.del("posts", p.id); S.posts = S.posts.filter(x => x !== p); }
    S.accounts = S.accounts.filter(a => a !== gone); S.current = S.accounts[0].id; await saveAccounts();
    await autoRun(); toast("Account removed"); go("#/me"); return;
  }
  if ("newnames" in d){ S.settings.nameSeed = Math.floor(Math.random()*1e9); S.settings.nameBump = {}; acctCache.clear(); usedHandles.clear(); await saveSettings(); toast("New names for everyone"); render(); return; }
  if ("newpfps" in d){ S.settings.pfpSeed = Math.floor(Math.random()*1e9); S.settings.pfpBump = {}; pfpCache.clear(); pfpPerm = null; await saveSettings(); toast("New pictures for everyone"); render(); return; }
  if ("randhandle" in d){ const h = $("#ph"); if (h){ let x; do { x = gamerHandle(rng(Math.floor(Math.random()*1e9))); } while (S.accounts.some(o => o.handle === x)); h.value = x; } return; }
  if (d.umenu !== undefined){
    const i = +d.umenu;
    sheet(`<h3>@${esc(acct(i).handle)}</h3><button class="opt" data-u="name">New name</button><button class="opt" data-u="pfp">New picture</button>`, async el => {
      const b = el.closest("[data-u]"); if (!b) return;
      closeSheet();
      if (b.dataset.u === "name"){ usedHandles.delete(acct(i).handle); S.settings.nameBump = { ...(S.settings.nameBump || {}), [i]: nameBump(i) + 1 }; acctCache.delete(i); }
      else { S.settings.pfpBump = { ...(S.settings.pfpBump || {}), [i]: pfpBump(i) + 1 }; pfpCache.delete(i); }
      await saveSettings(); render();
    });
    return;
  }
  if ("newworld" in d){ S.settings.seed = Math.floor(Math.random()*1e9); S.settings.nameSeed = 0; S.settings.pfpSeed = 0; S.settings.nameBump = {}; S.settings.pfpBump = {}; acctCache.clear(); usedHandles.clear(); pfpCache.clear(); pfpPerm = null; genCache.clear(); S.follows = {}; await saveSettings(); await saveMisc(); toast("New set of fake accounts"); return; }
  if ("reset" in d){
    if (d.armed !== "1"){ d.armed = "1"; t.textContent = "Tap again: this erases every post on this phone"; return; }
    await DB.clear("posts"); await DB.clear("media"); await DB.clear("kv"); try { localStorage.clear(); } catch(_){}
    location.replace(location.pathname); return;
  }
});
$("#picker").addEventListener("change", async e => {
  const files = [...e.target.files]; e.target.value = "";
  draft.files = [];
  for (const f of files){ const key = uid("l_"); await DB.put("media", f, key); draft.files.push({ key, mime: f.type || "image/jpeg" }); }
  render();
});
$("#avPicker").addEventListener("change", async e => {
  const f = e.target.files[0]; e.target.value = ""; if (!f) return;
  const key = uid("av_"); await DB.put("media", f, key); Object.assign(A(), { avatar:key, avatarAuto:false }); await saveAccounts(); render();
});
document.addEventListener("keydown", e => { if (e.key === "Enter" && e.target.id === "cin"){ document.querySelector("[data-addc]")?.click(); } if (e.key === "Enter" && e.target.id === "dmin"){ document.querySelector("[data-dmsend]")?.click(); } if (e.key === "Escape"){ closeSheet(); if ($("#full").innerHTML){ closeFull(); render(); } } });
window.addEventListener("hashchange", () => { const r = route(); if ($("#full").innerHTML && !(r.name === "reels" && r.a)) closeFull(); });

/* no zooming: pinch and double-tap stay with the app */
for (const ev of ["gesturestart","gesturechange","gestureend"]) document.addEventListener(ev, e => e.preventDefault(), { passive:false });

/* ================= boot ================= */
(async function boot(){
  await DB.open();
  S.settings = { ...DEFAULT_SETTINGS, ...(await DB.get("kv","settings") || {}) };
  if (!S.settings.clientId) S.settings.clientId = CLIENT_ID;
  if (!S.settings.seed){ S.settings.seed = Math.floor(Math.random()*1e9); await saveSettings(); }
  S.posts = await DB.all("posts");
  S.secret = { key: "", ...(await DB.get("kv","secret") || {}) };
  S.accounts = (await DB.get("kv","accounts")) || [];
  if (!S.accounts.length){
    // first run, or an older single-account version: carry the old profile over as account 1
    const old = await DB.get("kv","profile");
    const a = { ...newAccount(0), ...(old || {}), interval: S.settings.interval || 720, level: S.settings.level || "normal", folderName:"", folderId:"" };
    if (!a.startedAt) a.startedAt = now() - 30*D;
    S.accounts = [a];
    for (const p of S.posts) if (!p.acct && p.publishAt){ p.acct = a.id; await savePost(p); }
  }
  S.current = (await DB.get("kv","current")) || S.accounts[0].id;
  {
    // older versions kept captions, story text and one shared "main" folder in settings
    const st = S.settings, carry = {};
    for (const k of PER_ACCOUNT) if (st[k] !== undefined && st[k] !== "") carry[k] = st[k];
    S.accounts = S.accounts.map(a => ({ ...DEFAULT_ACCOUNT, ...carry, ...a }));
    if (!st.perAccount){
      const main = (st.folderName || "").trim();
      if (main && !S.accounts.some(a => (a.folderName||"").trim().toLowerCase() === main.toLowerCase())){
        const free = S.accounts.find(a => !hasFolder(a));
        if (free) Object.assign(free, { folderName: main, folderId: st.folderId || "", folderLink: false });
      }
      for (const a of S.accounts){ a.order = "random"; await shuffleQueue(a); }
      st.folderName = ""; st.folderId = ""; st.perAccount = 1; await saveSettings();
    }
  }
  if (!S.settings.morePosts){
    for (const a of S.accounts) if (+a.interval >= 720){ a.interval = 180; await respace(a); }
    S.settings.morePosts = 1; await saveSettings();
  }
  await saveAccounts();
  const misc = await DB.get("kv","misc") || {};
  S.follows = (misc.follows && !Object.keys(misc.follows).every(k => /^\d+$/.test(k))) ? misc.follows : {};
  S.seenAt = typeof misc.seenAt === "object" && misc.seenAt ? misc.seenAt : {};
  S.saved = misc.saved || {}; S.storySeen = misc.storySeen || {}; S.postSeen = misc.postSeen || {}; S.dms = misc.dms || {}; S.dmRead = misc.dmRead || {}; S.savedVids = misc.savedVids || {}; S.vidSeen = misc.vidSeen || {};
  if (navigator.storage?.persist) navigator.storage.persist().catch(()=>{});
  loadPfps();
  const back = takeOAuthReturn();
  await autoRun();
  render();
  let last = 0; try { last = +localStorage.getItem("reel-synced-at") || 0; } catch(e){}
  let fullPending = false; try { fullPending = localStorage.getItem("reel-full-pending") === "1"; localStorage.removeItem("reel-full-pending"); } catch(e){}
  if (back && fullPending) sync(false, true);
  else if (back || now() - last > 20*60e3) sync(true);
  setInterval(() => sync(true), 30*60e3);
  setInterval(() => autoStories(), 30*60e3);
  setInterval(writerRun, 4*60e3);
  document.addEventListener("visibilitychange", () => { if (document.visibilityState === "hidden") homeOrder = null; });
  document.addEventListener("visibilitychange", () => { let l = 0; try { l = +localStorage.getItem("reel-synced-at") || 0; } catch(e){} if (document.visibilityState === "visible"){ autoStories().then(render); if (now() - l > 20*60e3) sync(true); } });
  setInterval(() => { if (["home","me","activity","all"].includes(route().name)) safeRender(); }, 60e3);
  if ("serviceWorker" in navigator && location.protocol === "https:") navigator.serviceWorker.register("sw.js", { updateViaCache: "none" }).then(reg => document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") reg.update().catch(()=>{}); })).catch(()=>{});
})();
</script>
