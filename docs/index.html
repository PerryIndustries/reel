<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Reel">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<title>Reel</title>
<style>
:root{
  --bg:#ffffff; --fg:#0f0f12; --muted:#737380; --line:#e6e6ea; --soft:#f3f3f6;
  --accent:#ff5a36; --accent-fg:#ffffff; --heart:#ff3040; --link:#3b6cf6;
  --font:-apple-system,"SF Pro Text","Segoe UI",system-ui,sans-serif;
  --display:-apple-system,"SF Pro Display","Segoe UI",system-ui,sans-serif;
  --bar:52px;
}
@media (prefers-color-scheme: dark){:root{
  --bg:#000000; --fg:#f4f4f6; --muted:#a0a0ab; --line:#26262b; --soft:#141417;
  --accent:#ff7350; --accent-fg:#160803; --heart:#ff3b55; --link:#7c9cff; color-scheme:dark}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--fg);font:15px/1.4 var(--font);overscroll-behavior-y:none}
[hidden]{display:none!important}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
a{color:inherit;text-decoration:none}
input,textarea,select{font:inherit;color:var(--fg);background:var(--soft);border:1px solid var(--line);border-radius:10px;padding:10px 12px;width:100%;min-width:0}
textarea{min-height:90px;resize:vertical}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.muted{color:var(--muted)}
.small{font-size:13px}
.num{font-variant-numeric:tabular-nums}

/* app chrome */
.top{position:sticky;top:0;z-index:10;background:var(--bg);padding-top:env(safe-area-inset-top,0px);border-bottom:1px solid var(--line)}
.top .in{height:48px;display:flex;align-items:center;gap:10px;padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px))}
.top h1{font:700 19px var(--display);margin:0;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top h1.logo{font:800 26px var(--display);letter-spacing:-.03em}
.top h1 button{font:inherit;display:inline-flex;align-items:center;gap:4px}
.top h1 button svg{width:16px;height:16px}
.iconbtn{width:36px;height:36px;display:grid;place-items:center;border-radius:50%}
.iconbtn svg{width:24px;height:24px}
main{padding-bottom:calc(var(--bar) + env(safe-area-inset-bottom,0px) + 20px);max-width:640px;margin:0 auto}
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:10;background:var(--bg);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
.tabbar .in{height:var(--bar);display:grid;grid-template-columns:repeat(4,1fr);max-width:640px;margin:0 auto}
.tabbar button{display:grid;place-items:center;position:relative}
.tabbar svg{width:26px;height:26px}
.tabbar .dot{position:absolute;top:10px;left:calc(50% + 8px);width:8px;height:8px;border-radius:50%;background:var(--heart)}
.tabbar .me{width:28px;height:28px;border-radius:50%;overflow:hidden;border:2px solid transparent}
.tabbar .on .me{border-color:var(--fg)}
.pad{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* avatars */
.av{border-radius:50%;overflow:hidden;display:grid;place-items:center;flex:none;color:#fff;font-weight:700;background:var(--soft)}
.av img{width:100%;height:100%;object-fit:cover}
.av.s28{width:28px;height:28px;font-size:12px}.av.s32{width:32px;height:32px;font-size:13px}.av.s44{width:44px;height:44px;font-size:17px}.av.s62{width:62px;height:62px;font-size:24px}.av.s86{width:86px;height:86px;font-size:34px}
.ring{padding:2px;border-radius:50%;background:conic-gradient(from 200deg,#ffb23f,#ff5a36,#d6249f,#6a5cff,#ffb23f);display:inline-block;line-height:0}
.ring.seen{background:var(--line)}
.ring.none{background:transparent}
.ring>.av{border:2px solid var(--bg)}
.check{display:inline-grid;place-items:center;width:15px;height:15px;border-radius:50%;background:#3b8cf6;color:#fff;vertical-align:-2px;margin-left:3px}
.check svg{width:10px;height:10px}

/* stories tray */
.tray{display:flex;gap:14px;overflow-x:auto;padding-block:10px;border-bottom:1px solid var(--line);scrollbar-width:none}
.tray::-webkit-scrollbar{display:none}
.st{display:flex;flex-direction:column;align-items:center;gap:4px;width:72px;flex:none;font-size:12px}
.st span.n{max-width:72px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* feed post */
.post{border-bottom:1px solid var(--line);padding-bottom:10px}
.phead{display:flex;align-items:center;gap:10px;padding:10px 0}
.phead .who{flex:1;min-width:0}
.phead b{font-weight:600}
.carousel{position:relative;background:var(--soft)}
.slides{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none}
.slides::-webkit-scrollbar{display:none}
.slide{flex:0 0 100%;scroll-snap-align:center;display:grid;place-items:center;background:#000;position:relative}
.slide img,.slide video{width:100%;max-height:75vh;object-fit:contain;display:block}
.mute{position:absolute;right:10px;bottom:10px;width:30px;height:30px;border-radius:50%;background:rgba(0,0,0,.6);color:#fff;display:grid;place-items:center}
.mute svg{width:16px;height:16px}
.count{position:absolute;top:10px;right:10px;background:rgba(0,0,0,.6);color:#fff;font-size:12px;padding:3px 8px;border-radius:999px}
.dots{display:flex;justify-content:center;gap:4px;padding-top:8px;min-height:14px}
.dots i{width:6px;height:6px;border-radius:50%;background:var(--line)}
.dots i.on{background:var(--link)}
.burst{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none}
.burst svg{width:96px;height:96px;color:#fff;filter:drop-shadow(0 4px 14px rgba(0,0,0,.4));animation:pop .8s ease-out forwards}
@keyframes pop{0%{transform:scale(.2);opacity:0}20%{transform:scale(1.15);opacity:1}40%{transform:scale(.95)}80%{opacity:1}100%{transform:scale(1);opacity:0}}
.pbar{display:flex;align-items:center;gap:14px;padding-top:6px}
.pbar .sp{flex:1}
.pbar button{display:flex;align-items:center;gap:5px;font-weight:600;font-size:14px}
.pbar svg{width:26px;height:26px}
.pbar .liked{color:var(--heart)}
.likes{font-weight:600;margin-top:6px;display:block;text-align:left}
.caption{margin-top:4px;white-space:pre-wrap;overflow-wrap:anywhere}
.caption b{font-weight:600}
.morec{display:block;margin-top:4px;color:var(--muted)}
.when{margin-top:4px;color:var(--muted);font-size:12px}
.clamp{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}

/* profile */
.prof{padding-top:14px}
.prow{display:flex;align-items:center;gap:22px}
.pstats{flex:1;display:grid;grid-template-columns:repeat(3,1fr);text-align:center}
.pstats button{display:flex;flex-direction:column;align-items:center}
.pstats b{font-size:17px;font-weight:700}
.pstats span{font-size:13px}
.pname{font-weight:600;margin-top:12px}
.pbio{white-space:pre-wrap;overflow-wrap:anywhere;margin-top:2px}
.plink{color:var(--link);font-weight:500}
.pbtns{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:12px}
.btn{background:var(--soft);border-radius:9px;padding:8px 12px;font-weight:600;font-size:14px;text-align:center;display:block;width:100%}
.btn.primary{background:var(--accent);color:var(--accent-fg)}
.btn.blue{background:#3b8cf6;color:#fff}
.btn.danger{color:var(--heart)}
.ptabs{display:grid;grid-template-columns:repeat(3,1fr);margin-top:14px;border-bottom:1px solid var(--line)}
.ptabs button{padding:10px;display:flex;justify-content:center;align-items:center;gap:4px;color:var(--muted);border-bottom:1px solid transparent;margin-bottom:-1px}
.ptabs button.on{color:var(--fg);border-bottom-color:var(--fg)}
.ptabs svg{width:24px;height:24px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:2px}
.tile{position:relative;aspect-ratio:3/4;max-width:100%;overflow:hidden;background:var(--soft);display:block;width:100%}
.tile.tall{aspect-ratio:9/16}
.tile img,.tile video{width:100%;height:100%;object-fit:cover;display:block}
.tile .ic{position:absolute;top:6px;right:6px;color:#fff;filter:drop-shadow(0 1px 2px rgba(0,0,0,.6))}
.tile .ic svg{width:18px;height:18px}
.tile .views{position:absolute;left:6px;bottom:6px;color:#fff;font-size:12px;font-weight:600;display:flex;align-items:center;gap:3px;filter:drop-shadow(0 1px 2px rgba(0,0,0,.7))}
.tile .views svg{width:13px;height:13px}

/* lists */
.list .row{display:flex;align-items:center;gap:12px;padding:8px 0}
.list .row .who{flex:1;min-width:0}
.list .row .who div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.list .row .btn{width:auto;padding:6px 14px}
.cmt{display:flex;gap:12px;padding:10px 0}
.cmt .body{flex:1;min-width:0}
.cmt .t{white-space:pre-wrap;overflow-wrap:anywhere}
.cmt .meta{display:flex;gap:14px;margin-top:4px;font-size:12px;color:var(--muted)}
.cmt .h{display:grid;justify-items:center;color:var(--muted);font-size:11px;padding-top:4px}
.cmt .h svg{width:14px;height:14px}
.cbox{position:fixed;left:0;right:0;bottom:calc(var(--bar) + env(safe-area-inset-bottom,0px));background:var(--bg);border-top:1px solid var(--line);z-index:9}
.cbox .in{display:flex;gap:10px;align-items:center;padding-block:8px;max-width:640px;margin:0 auto}
.cbox input{border-radius:999px}
.cbox button{color:var(--link);font-weight:600}

/* activity */
.act{display:flex;gap:12px;align-items:center;padding:9px 0}
.act .t{flex:1;min-width:0;overflow-wrap:anywhere}
.act .thumb{width:44px;height:44px;flex:none;background:var(--soft);border-radius:4px;overflow:hidden}
.act .thumb img,.act .thumb video{width:100%;height:100%;object-fit:cover}
.sect{font-weight:700;font-size:16px;padding-top:16px;padding-bottom:4px}

/* forms */
.form{display:flex;flex-direction:column;gap:14px;padding-top:16px}
.field{display:flex;flex-direction:column;gap:6px}
.field label,.lbl{font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.hint{font-size:13px;color:var(--muted)}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:6px}
.seg button{border:1px solid var(--line);border-radius:9px;padding:9px 4px;font-weight:600;font-size:13px}
.seg button[aria-pressed="true"]{border-color:var(--accent);color:var(--accent)}
.card{border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:10px}
.card h3{margin:0;font:700 16px var(--display)}
.code{font-family:ui-monospace,Menlo,monospace;font-size:12px;background:var(--soft);border-radius:8px;padding:8px 10px;overflow-wrap:anywhere;user-select:all}
.thumbs{display:flex;gap:6px;flex-wrap:wrap}
.thumbs .th{width:72px;height:72px;border-radius:8px;overflow:hidden;background:var(--soft)}
.thumbs img,.thumbs video{width:100%;height:100%;object-fit:cover}
.status{font-size:13px;color:var(--muted);min-height:18px}
.progress{height:4px;border-radius:2px;background:var(--soft);overflow:hidden}
.progress i{display:block;height:100%;background:var(--accent);width:0;transition:width .2s}
.qrow{display:flex;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.qrow .th{width:56px;height:56px;border-radius:6px;overflow:hidden;background:var(--soft);flex:none}
.qrow .th img,.qrow .th video{width:100%;height:100%;object-fit:cover}
.qrow .info{flex:1;min-width:0}
.qrow .info div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.qrow .btn{width:auto;padding:6px 10px;font-size:13px}
.arow{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line);width:100%;text-align:left}
.arow .who{flex:1;min-width:0}
.empty{text-align:center;padding:56px 24px;color:var(--muted)}
.empty h2{color:var(--fg);font:700 20px var(--display);margin:0 0 6px}
.empty .btn{display:inline-block;width:auto;margin-top:16px;padding:10px 18px}

/* sheet + toast */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:60;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:640px;max-height:90%;overflow:auto;border-radius:16px 16px 0 0;padding-block:8px calc(16px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column}
.sheet .grab{width:38px;height:4px;border-radius:2px;background:var(--line);margin:4px auto 10px}
.sheet .opt{padding:14px 0;text-align:left;font-size:16px;border-bottom:1px solid var(--line)}
.sheet .opt:last-child{border-bottom:0}
.sheet .opt.red{color:var(--heart)}
.sheet h3{margin:0 0 4px;font:700 17px var(--display)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--bar) + env(safe-area-inset-bottom,0px) + 70px);background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:999px;font-weight:600;font-size:14px;z-index:80;max-width:calc(100% - 32px);text-align:center}

/* full-screen viewers (stories, reels) */
.full{position:fixed;inset:0;background:#000;color:#fff;z-index:50}
.sv .media{position:absolute;inset:0}
.sv .media img,.sv .media video{width:100%;height:100%;object-fit:cover}
.sv .shade{position:absolute;inset:0;background:linear-gradient(rgba(0,0,0,.45),transparent 18%,transparent 75%,rgba(0,0,0,.5));pointer-events:none}
.sv .bars{position:absolute;top:calc(env(safe-area-inset-top,0px) + 8px);left:8px;right:8px;display:flex;gap:3px}
.sv .bar{flex:1;height:2.5px;background:rgba(255,255,255,.35);border-radius:2px;overflow:hidden}
.sv .bar i{display:block;height:100%;background:#fff;width:0}
.sv .hd{position:absolute;top:calc(env(safe-area-inset-top,0px) + 20px);left:12px;right:8px;display:flex;align-items:center;gap:8px;font-size:14px}
.sv .hd .sp{flex:1}
.sv .hd .x{width:36px;height:36px;display:grid;place-items:center;color:#fff}
.sv .hd .x svg{width:26px;height:26px}
.sv .txt{position:absolute;left:20px;right:20px;top:60%;text-align:center;pointer-events:none}
.sv .txt span{font:800 25px/1.55 var(--display);background:#fff;color:#000;padding:2px 10px;-webkit-box-decoration-break:clone;box-decoration-break:clone;border-radius:6px}
.sv .taps{position:absolute;inset:80px 0 90px;display:grid;grid-template-columns:1fr 2fr}
.sv .ft{position:absolute;left:12px;right:12px;bottom:calc(env(safe-area-inset-bottom,0px) + 14px);display:flex;gap:10px;align-items:center}
.sv .ft .reply{flex:1;border:1px solid rgba(255,255,255,.6);border-radius:999px;padding:10px 14px;color:rgba(255,255,255,.85);font-size:14px}
.sv .ft .seen{display:flex;flex-direction:column;align-items:flex-start;gap:2px;font-size:13px;font-weight:600}
.sv .ft svg{width:26px;height:26px;color:#fff}
.rv{overflow-y:auto;scroll-snap-type:y mandatory;scrollbar-width:none}
.rv::-webkit-scrollbar{display:none}
.rv .r{position:relative;height:100vh;height:100dvh;scroll-snap-align:start;scroll-snap-stop:always}
.rv video{width:100%;height:100%;object-fit:cover}
.rv .side{position:absolute;right:10px;bottom:calc(env(safe-area-inset-bottom,0px) + 90px);display:flex;flex-direction:column;gap:18px;align-items:center;font-size:12px;font-weight:600}
.rv .side button,.rv .side a{display:flex;flex-direction:column;align-items:center;gap:3px;color:#fff}
.rv .side svg{width:30px;height:30px}
.rv .side .liked{color:var(--heart)}
.rv .info{position:absolute;left:14px;right:70px;bottom:calc(env(safe-area-inset-bottom,0px) + 22px);text-shadow:0 1px 3px rgba(0,0,0,.7)}
.rv .info .u{display:flex;align-items:center;gap:8px;font-weight:600;margin-bottom:6px}
.rv .shade{position:absolute;inset:0;background:linear-gradient(transparent 60%,rgba(0,0,0,.55));pointer-events:none}
.rv .close{position:fixed;top:calc(env(safe-area-inset-top,0px) + 10px);left:10px;z-index:2;width:40px;height:40px;display:grid;place-items:center;color:#fff}
.rv .close svg{width:28px;height:28px}
@media (prefers-reduced-motion:reduce){.burst svg{animation:none;opacity:0}}
</style>
</head>
<body>
<header class="top"><div class="in" id="top"></div></header>
<main id="view"></main>
<nav class="tabbar"><div class="in">
  <button type="button" data-tab="home" aria-label="Home"></button>
  <button type="button" data-tab="reels" aria-label="Reels"></button>
  <button type="button" data-tab="activity" aria-label="Activity"></button>
  <button type="button" data-tab="me" aria-label="Profile"></button>
</div></nav>
<div id="full"></div>
<div id="layer"></div>
<div class="toast" id="toast" hidden></div>
<input type="file" id="picker" accept="image/*,video/*" multiple hidden>
<input type="file" id="avPicker" accept="image/*" hidden>

<script>
"use strict";
/* ================= icons ================= */
const I = {
  home:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5V21h-6v-6H9v6H3z"/></svg>',
  homeOn:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M3 10.5 12 3l9 7.5V21h-6v-6H9v6H3z"/></svg>',
  reels:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="5"/><path d="M3 8.5h18M8.5 3l3 5.5M14.5 3l3 5.5"/><path d="M10 12.2v5l4.3-2.5z" fill="currentColor"/></svg>',
  reelsOn:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="5"/><path d="M3 8.5h18M8.5 3l3 5.5M14.5 3l3 5.5"/><path d="M10 12.2v5l4.3-2.5z" fill="currentColor"/></svg>',
  heart:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M12 20.5s-8.5-5-8.5-11A4.8 4.8 0 0 1 12 6.6a4.8 4.8 0 0 1 8.5 2.9c0 6-8.5 11-8.5 11z"/></svg>',
  heartOn:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 20.5s-8.5-5-8.5-11A4.8 4.8 0 0 1 12 6.6a4.8 4.8 0 0 1 8.5 2.9c0 6-8.5 11-8.5 11z"/></svg>',
  comment:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M20.5 11.5a8.5 8.5 0 0 1-12.6 7.4L3.5 20.5l1.6-4.2A8.5 8.5 0 1 1 20.5 11.5z"/></svg>',
  share:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M21.5 3 10 14M21.5 3 15 21l-5-7-7-3z"/></svg>',
  save:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M5 3h14v18l-7-5-7 5z"/></svg>',
  saveOn:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M5 3h14v18l-7-5-7 5z"/></svg>',
  back:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5 8 12l7 7"/></svg>',
  close:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg>',
  down:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>',
  menu:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg>',

// Shared-folder files go to whichever account has the least waiting for it; an account's own folder only feeds that account.
async function autoSchedule(){
  if (!S.accounts.length) return;

  const takers = S.accounts.filter(a => !a.folderName.trim()).length ? S.accounts.filter(a => !a.folderName.trim()) : S.accounts;

  const W = waitingAll(); if (!W.length) return;
  const load = a => queued(a.id).length + W.filter(p => p.acct === a.id).length;
  for (const p of W){
    if (p.acct && accountById(p.acct)) continue;
    const a = takers.slice().sort((x,y) => load(x) - load(y))[0];
    p.acct = a.id; await savePost(p);
  }
  for (const a of S.accounts){
    const mine = W.filter(p => p.acct === a.id); if (!mine.length) continue;
    const firstRun = !live(a.id).length && !queued(a.id).length;
    const n = firstRun ? Math.min(Math.ceil(mine.length/2), Math.max(0, +S.settings.starter || 0)) : 0;

async function frameB64(f){

async function gapi(path, token, asBlob){
  const res = await fetch("https://www.googleapis.com/drive/v3/" + path, { headers: { Authorization: "Bearer " + token } });
  if (res.status === 401){ localStorage.removeItem("reel-token"); throw new Error("signin"); }
  if (!res.ok) throw new Error("Drive said " + res.status);
  return asBlob ? res.blob() : res.json();
}
async function listChildren(id, token){
  const out = []; let pageToken = "";
  do {
    const q = encodeURIComponent(`'${id}' in parents and trashed=false`);
    const j = await gapi(`files?q=${q}&pageSize=1000&fields=nextPageToken,files(id,name,mimeType,modifiedTime,createdTime,size)&supportsAllDrives=true&includeItemsFromAllDrives=true${pageToken?"&pageToken="+pageToken:""}`, token);
    out.push(...j.files); pageToken = j.nextPageToken || "";
  } while (pageToken);
  return out;
}
async function findFolder(name, token){
  const n = name.trim().replace(/\\/g,"\\\\").replace(/'/g,"\\'");
  const j = await gapi(`files?q=${encodeURIComponent(`name='${n}' and mimeType='${FOLDER}' and trashed=false`)}&fields=files(id,name)&supportsAllDrives=true&includeItemsFromAllDrives=true`, token);
  if (!j.files.length) throw new Error(`No Drive folder named “${name.trim()}”. Check the spelling.`);
  return j.files[0].id;
}
const FOLDER = "application/vnd.google-apps.folder";
const base = n => n.replace(/\.[^.]+$/, "").toLowerCase();
const isText = f => f.mimeType === "text/plain" || /\.txt$/i.test(f.name);
const isMedia = f => isImage(f.mimeType) || isVideo(f.mimeType);
const hasSetup = () => !!(S.settings.folderName.trim() || S.accounts.some(a => a.folderName.trim()));

let syncing = false;
// full = "re-read everything": find every folder again by name and rebuild the queue from what's in them now.
async function sync(auto, full){
  if (syncing) return;
  if (auto && (!S.settings.clientId.trim() || !hasSetup())) return;
  if (!hasSetup()){ toast("Type a Drive folder name first"); go("#/settings"); return; }
  const token = tokenOK();
  if (!token){
    if (!auto) { if (full) try { localStorage.setItem("reel-full-pending", "1"); } catch(e){} signIn(false); return; }
    let last = 0; try { last = +localStorage.getItem("reel-silent-at") || 0; } catch(e){}
    if (!needsGoogle() && now() - last > 10*60e3) signIn(true);
    return;
  }
  syncing = true; setSync("Finding your folders…", 0);
  try {
    // A text file named reel-key.txt anywhere in your Drive hands the caption writer its Anthropic key.
    try {
      const kf = (await gapi(`files?q=${encodeURIComponent("name='reel-key.txt' and trashed=false")}&orderBy=modifiedTime desc&fields=files(id,modifiedTime)&pageSize=1`, token)).files[0];
      if (kf && kf.modifiedTime !== S.secret.keyFrom){
        const k = (await (await gapi(`files/${kf.id}?alt=media`, token, true)).text()).trim();
        if (/^sk-ant-\S{20,}$/.test(k)){ S.secret.key = k; S.secret.keyFrom = kf.modifiedTime; await saveSecret(); client = null; setWriter(""); toast("Caption writer connected"); setTimeout(writerRun, 1500); }
      }
    } catch(e){ if (e.message === "signin") throw e; }
    // sources: the shared folder (split across accounts) + each account's own folder
    const sources = [];
    if (S.settings.folderName.trim()) sources.push({ owner: null, holder: S.settings });
    for (const a of S.accounts) if (a.folderName.trim()) sources.push({ owner: a.id, holder: a });
    if (full){ S.settings.folderId = ""; for (const a of S.accounts) a.folderId = ""; }
    const isUp = p => p.publishAt && p.publishAt <= now();
    const known = new Set(S.posts.filter(p => !full || isUp(p)).map(p => p.driveKey).filter(Boolean));
    const seen = new Map();
    const ignored = new Set(S.settings.ignored || []);
    const jobs = [], pfpJobs = [];
    for (const src of sources){
      if (!src.holder.folderId){ src.holder.folderId = await findFolder(src.holder.folderName, token); await saveSettings(); await saveAccounts(); }
      setSync("Reading " + src.holder.folderName.trim() + "…", 0);
      const kids = await listChildren(src.holder.folderId, token);
      const texts = new Map(kids.filter(isText).map(f => [base(f.name), f]));
      const target = src.owner ? accountById(src.owner) : S.accounts[0];
      for (const f of kids){
        const b = base(f.name);
        if ((b === "avatar" || b === "profile") && isImage(f.mimeType) && target && target.avatarDrive !== f.id) jobs.push({ kind:"avatar", f, a: target });
        if (b === "bio" && isText(f) && target && target.bioDrive !== f.modifiedTime) jobs.push({ kind:"bio", f, a: target });
      }
      const posts = [];
      for (const f of kids){
        const b = base(f.name);
        if (["avatar","profile","bio"].includes(b)) continue;
        if (f.mimeType === FOLDER && b === "pfps"){
          for (const m of (await listChildren(f.id, token)).filter(x => isImage(x.mimeType))) pfpJobs.push(m);
          continue;
        }
        if (f.mimeType === FOLDER && b === "stories"){
          const inner = await listChildren(f.id, token);
          for (const m of inner.filter(isMedia)){ if (!seen.has(m.id)) seen.set(m.id, src.owner); if (!known.has(m.id) && !ignored.has(m.id)) jobs.push({ kind:"story", key:m.id, media:[m], owner: src.owner }); }
          continue;
        }
        if ((f.mimeType === FOLDER || isMedia(f)) && !seen.has(f.id)) seen.set(f.id, src.owner);
        if (known.has(f.id) || ignored.has(f.id)) continue;
        if (f.mimeType === FOLDER){
          const inner = await listChildren(f.id, token);
          const media = inner.filter(isMedia).sort((a,b) => natural.compare(a.name,b.name));
          if (media.length) posts.push({ kind:"post", key:f.id, name:f.name, time:f.createdTime, media, caption: inner.find(isText), owner: src.owner });
        } else if (isMedia(f)) posts.push({ kind:"post", key:f.id, name:f.name, time:f.createdTime, media:[f], caption: texts.get(b), owner: src.owner });
      }
      if (S.settings.order === "date") posts.sort((a,b) => (a.time||"").localeCompare(b.time||""));
      else if (S.settings.order === "random"){ const r = rng(hashStr("o"+now())); posts.sort(() => r() - .5); }
      else posts.sort((a,b) => natural.compare(a.name,b.name));
      jobs.push(...posts);
    }
    // Every folder was read, so the queue can now follow Drive: moved files change account, removed files leave the queue. Posted ones stay.
    let moved = 0, dropped = 0;
    for (const p of S.posts.filter(p => p.source === "drive" && p.driveKey && !isUp(p))){
      if (full || !seen.has(p.driveKey)){ await DB.del("posts", p.id); S.posts = S.posts.filter(x => x !== p); if (!seen.has(p.driveKey)) dropped++; continue; }
      const owner = seen.get(p.driveKey);
      const wasOwner = p.shared === false ? p.acct : null;
      if (owner !== wasOwner){ p.acct = owner || null; p.shared = !owner; p.publishAt = 0; await savePost(p); moved++; }
    }
    // pictures for the fake commenters
    const pfpKeys = [];
    for (const m of pfpJobs){
      const key = "pf_" + m.id;
      if (!(await DB.get("media", key))){ setSync("Downloading profile pictures…", 0); await DB.put("media", await gapi(`files/${m.id}?alt=media`, token, true), key); }
      pfpKeys.push(key);
    }
    if (pfpKeys.join() !== (S.settings.customPfps || []).join()){ S.settings.customPfps = pfpKeys; pfpCache.clear(); pfpPerm = null; await saveSettings(); }
    const totalFiles = jobs.reduce((n,e) => n + (e.media ? e.media.length : 1), 0);
    let done = 0, fresh = 0;
    let order = Math.max(0, ...S.posts.map(p => p.order||0));
    for (const e of jobs){
      if (e.kind === "avatar"){ const blob = await gapi(`files/${e.f.id}?alt=media`, token, true); const key = "d_"+e.f.id; await DB.put("media", blob, key); urls.delete(key); Object.assign(e.a, { avatar:key, avatarAuto:false, avatarDrive:e.f.id }); await saveAccounts(); done++; continue; }
      if (e.kind === "bio"){ const blob = await gapi(`files/${e.f.id}?alt=media`, token, true); Object.assign(e.a, { bio:(await blob.text()).trim(), bioDrive:e.f.modifiedTime }); await saveAccounts(); done++; continue; }
      const files = [];
      for (const m of e.media){
        setSync(`Downloading ${done+1} of ${totalFiles}…`, totalFiles ? done/totalFiles : 1);
        const key = "d_" + m.id;
        if (!(await DB.get("media", key))){ const blob = await gapi(`files/${m.id}?alt=media`, token, true); await DB.put("media", blob, key); }
        files.push({ key, mime: m.mimeType, driveId: m.id }); done++;
      }
      let caption = "";
      if (e.caption){ caption = (await (await gapi(`files/${e.caption.id}?alt=media`, token, true)).text()).trim(); }
      const p = { id: uid(e.kind === "story" ? "s_" : "p_"), kind: e.kind, driveKey: e.key, source:"drive", acct: e.owner || null, shared: !e.owner, files, caption, captionManual: !!caption, createdAt: now(), publishAt: 0, seed: hashStr(e.key), order: ++order, myComments: [], hidden: [] };
      await savePost(p); fresh++;
    }
    setSync("", 1);
    syncing = false;
    try { localStorage.setItem("reel-synced-at", String(now())); } catch(e){}
    if (full){
      // tidy up downloads nothing uses any more
      const used = new Set([...S.posts.flatMap(p => p.files.map(f => f.key)), ...S.accounts.map(a => a.avatar), ...(S.settings.customPfps || [])]);
      for (const k of await DB.keys("media")) if (String(k).startsWith("d_") && !used.has(k)){ await DB.del("media", k); urls.delete(k); }
      for (const a of S.accounts) if (a.avatarAuto && a.avatar && !used.has(a.avatar)) a.avatar = null;
    }
    await saveSettings(); await saveAccounts();
    await autoRun();
    if (full){ const q = S.posts.filter(p => !isStory(p) && !isUp(p)).length; toast(`Re-read all folders: ${q} queued across ${S.accounts.length} ${S.accounts.length===1?"account":"accounts"}`); }
    else if (!auto) toast(fresh ? `The bot picked up ${fresh} new ${fresh===1?"file":"files"}` : moved ? `${moved} moved ${moved===1?"file":"files"} switched account` : dropped ? `${dropped} removed ${dropped===1?"file":"files"} left the queue` : jobs.length ? "Profile updated from Drive" : "No new files in your folders");
    render();
  } catch(err){
    syncing = false; setSync("", 0);
    if (err.message === "signin"){ if (!auto) signIn(false); return; }
    if (!auto) toast(err.message || "Sync failed");
    render();
  }
}

function vList(v, r){
  const kind = r.a, id = r.b;
  let title = "", ids = [], total = 0;
  if (kind === "likes"){ const p = S.posts.find(x=>x.id===id); title = "Likes"; if (p){ total = engage(p).likes; ids = likerSample(p, Math.min(total, 60)); } }
  else if (kind === "views"){ const p = S.posts.find(x=>x.id===id); title = "Viewers"; if (p){ total = storyStats(p).views; ids = likerSample(p, Math.min(total, 80)); } }
  else {
    const who = id === "me" ? null : acct(+id);
    title = kind === "followers" ? "Followers" : "Following";
    total = who ? (kind === "followers" ? who.followers : who.following) : (kind === "followers" ? followersNow() : followingCount());
    const rr = rng(hashStr(kind+id+S.settings.seed+A().seed)); const set = new Set();
    if (!who && kind === "following"){ for (let i=0;i<POOL;i++) if (isFollowing(i)) set.add(i); }
    else if (!who && kind === "followers"){ for (let i=0;i<POOL;i++) if (followsYou(i)) set.add(i); }
    else while (set.size < Math.min(50, total)) set.add(Math.floor(rr()*POOL));
    ids = [...set].slice(0, 80);
  }
  setTop(`${backBtn}<h1>${esc(title)}</h1>`);
  v.innerHTML = `<div class="pad list"><div class="hint" style="padding-top:10px">${full(total)} ${title.toLowerCase()}</div>
    ${ids.map(i => { const a = acct(i); const fol = isFollowing(i); return `<div class="row"><a href="#/u/${i}">${acctAv(a,44)}</a><a class="who" href="#/u/${i}"><div><b>${esc(a.handle)}</b>${checkMark(a.verified)}</div><div class="muted small">${esc(a.name)}</div></a><button class="btn ${fol?"":"blue"}" type="button" data-follow="${i}">${fol?"Following":"Follow"}</button></div>`; }).join("")}
    ${total > ids.length ? `<div class="hint" style="padding:12px 0">and ${full(total-ids.length)} more</div>` : ""}</div>`;
}

function events(){
  const a = A(); const ev = [];
  for (const p of live().slice(0, 15)){
    const e = engage(p); const f = p.files[0];
    for (const c of visibleComments(p).filter(c=>!c.mine).slice(-4)) ev.push({ at:c.at, acct:c.acct, html:`<b>${esc(acct(c.acct).handle)}</b> commented: ${esc(c.text)}`, p, f });
    { const fb = Math.round(followBump(p, a) * curve(now() - p.publishAt, 5*H)); if (fb > 0){ const rr = rng(p.seed ^ 0x51ed27); const i = Math.floor(rr()*POOL); ev.push({ at: Math.min(now(), p.publishAt + (20 + rr()*90)*60e3), acct:i, html: fb > 1 ? `<b>${esc(acct(i).handle)}</b> and ${full(fb-1)} others started following you after your ${isVideo(f.mime) && p.files.length===1 ? "reel" : "post"}.` : `<b>${esc(acct(i).handle)}</b> started following you.`, follow:i }); } }
    if (e.likes > 2){ const s = likerSample(p, 2); ev.push({ at: Math.min(now(), p.publishAt + 25*60e3), acct:s[0], html:`<b>${esc(acct(s[0]).handle)}</b>, <b>${esc(acct(s[1]).handle)}</b> and ${full(e.likes-2)} others liked your ${isVideo(f.mime) && p.files.length===1 ? "reel" : "post"}.`, p, f }); }
  }
  for (const p of activeStories(a.id)){ const s = storyStats(p); if (s.likes > 1){ const l = likerSample(p, 1)[0]; ev.push({ at: Math.min(now(), p.publishAt + 15*60e3), acct:l, html:`<b>${esc(acct(l).handle)}</b> and ${full(s.likes-1)} others liked your story.`, p, f:p.files[0], story:true }); } }
  const r = rng(hashStr("ev"+Math.floor(now()/D)+a.seed));
  for (let d=0; d<10; d++) for (let k=0; k<3; k++){ const t = now() - d*D - r()*D; const i = Math.floor(r()*POOL); if (t > (a.startedAt||0)) ev.push({ at:t, acct:i, html:`<b>${esc(acct(i).handle)}</b> started following you.`, follow:i }); }
  return ev.filter(e => e.at <= now()).sort((x,y) => y.at - x.at).slice(0, 80);
}
const unseen = () => live().length && events().some(e => e.at > (S.seenAt[A().id]||0));
function vActivity(v){
  setTop(`<h1>Activity</h1>`);
  const ev = events();
  const seen = S.seenAt[A().id] || 0;
  S.seenAt[A().id] = now(); saveMisc();
  if (!ev.length){ v.innerHTML = `<div class="empty"><h2>No activity yet</h2><p>Likes, comments and new followers show up here once you've posted.</p></div>`; return; }
  const groups = [["New", e => e.at > seen], ["Today", e => now()-e.at < D], ["This week", e => now()-e.at < 7*D], ["Earlier", () => true]];
  const used = new Set(); let html = "";
  for (const [label, test] of groups){
    const g = ev.filter(e => !used.has(e) && test(e)); g.forEach(e => used.add(e));
    if (!g.length) continue;
    html += `<div class="sect">${label}</div>` + g.map(e => `<div class="act"><a href="#/u/${e.acct}">${acctAv(acct(e.acct),44)}</a><div class="t">${e.html} <span class="muted">${esc(ago(e.at))}</span></div>${e.p ? `<${e.story?`button type="button" data-story="${esc(e.p.acct)}"`:`a href="#/p/${esc(e.p.id)}"`} class="thumb">${mediaTag(e.f,"",{poster:true})}</${e.story?"button":"a"}>` : `<button class="btn ${isFollowing(e.follow)?"":"blue"}" style="width:auto;padding:6px 12px" type="button" data-follow="${e.follow}">${isFollowing(e.follow)?"Following":"Follow back"}</button>`}</div>`).join("");
  }
  v.innerHTML = `<div class="pad">${html}</div>`;
}

async function openReels(list, startId){
  const start = Math.max(0, list.findIndex(p => p.id === startId));
  $("#full").innerHTML = `<div class="full rv" id="rv"><button class="close" type="button" data-closefull aria-label="Close">${I.back}</button>
    ${list.map(p => { const a = accountById(p.acct) || A(); const e = engage(p); return `<section class="r" data-reel="${esc(p.id)}">
      ${mediaTag(p.files[0],"",{auto:true})}<div class="shade"></div>
      <div class="side">
        <button type="button" data-rlike="${esc(p.id)}" class="${p.liked?"liked":""}">${p.liked?I.heartOn:I.heart}<span>${fmt(e.likes)}</span></button>
        <a href="#/c/${esc(p.id)}" data-closefull>${I.comment}<span>${fmt(e.comments)}</span></a>
        <button type="button" data-share>${I.share}</button>
        <button type="button" data-rmute>${I.muted}</button>
      </div>
      <div class="info"><div class="u">${myAv(32, a)}<span>${esc(handleOf(a))}</span>${checkMark(a.verified)}</div><div class="clamp">${esc(p.caption||"")}</div><div class="small" style="opacity:.85;margin-top:4px">${full(e.views)} views · ${esc(ago(p.publishAt))}</div></div>
    </section>`; }).join("")}</div>`;
  const rv = $("#rv");
  rv.scrollTop = start * rv.clientHeight;
  await hydrate(rv);
  // whichever reel fills the screen plays; the rest pause
  const vids = [...rv.querySelectorAll(".r video")];
  let current = -1;
  const activate = () => {
    const k = Math.round(rv.scrollTop / rv.clientHeight); if (k === current) return; current = k;
    vids.forEach((vd, j) => { if (j === k){ vd.muted = reelsMuted; vd.currentTime = 0; vd.play().catch(()=>{}); } else vd.pause(); });
  };
  let st = 0; rv.addEventListener("scroll", () => { clearTimeout(st); st = setTimeout(activate, 120); }, { passive: true });
  activate();
  rv.addEventListener("click", async e => {
    const t = e.target.closest("button,a"); if (!t){ const vd = e.target.closest(".r")?.querySelector("video"); if (vd){ reelsMuted = !reelsMuted; rv.querySelectorAll("video").forEach(x => x.muted = reelsMuted); rv.querySelectorAll("[data-rmute]").forEach(b => b.innerHTML = reelsMuted ? I.muted : I.sound); } return; }
    if ("closefull" in t.dataset){ closeFull(); if (t.tagName === "A") return; if (route().name === "reels" && route().a) history.back(); return; }
    if (t.dataset.rlike){ const p = S.posts.find(x => x.id === t.dataset.rlike); p.liked = !p.liked; await savePost(p); t.className = p.liked ? "liked" : ""; t.innerHTML = (p.liked?I.heartOn:I.heart) + `<span>${fmt(engage(p).likes)}</span>`; return; }
    if ("rmute" in t.dataset){ reelsMuted = !reelsMuted; rv.querySelectorAll("video").forEach(x => x.muted = reelsMuted); rv.querySelectorAll("[data-rmute]").forEach(b => b.innerHTML = reelsMuted ? I.muted : I.sound); return; }
    if ("share" in t.dataset) toast("Shared");
  });
}
let reelsMuted = true;
function closeFull(){ $("#full").querySelectorAll("video").forEach(v => v.pause()); $("#full").innerHTML = ""; clearTimeout(storyTimer); cancelAnimationFrame(storyRAF); }

/* ---------- stories ---------- */
let storyTimer = 0, storyRAF = 0;
function openStories(aid){
  const order = [aid, ...S.accounts.map(a => a.id).filter(id => id !== aid && activeStories(id).length)];
  let ai = 0, list = activeStories(order[0]);
  if (!list.length) return;
  let i = Math.max(0, list.findIndex(p => !S.storySeen[p.id]));
  const show = async () => {
    clearTimeout(storyTimer); cancelAnimationFrame(storyRAF);
    const p = list[i]; const a = accountById(p.acct) || A(); const st = storyStats(p); const f = p.files[0];
    S.storySeen[p.id] = true; saveMisc();
    $("#full").innerHTML = `<div class="full sv" id="sv">
      <div class="media">${isVideo(f.mime) ? `<video data-media="${esc(f.key)}" playsinline autoplay ${reelsMuted?"muted":""}></video>` : `<img data-media="${esc(f.key)}" alt="">`}</div><div class="shade"></div>
      <div class="bars">${list.map((_,k) => `<div class="bar"><i style="width:${k<i?100:0}%"></i></div>`).join("")}</div>
      <div class="hd">${myAv(32, a)}<b>${esc(handleOf(a))}</b><span style="opacity:.75">${esc(ago(p.publishAt))}</span><span class="sp"></span><button class="x" type="button" data-sclose aria-label="Close">${I.close}</button></div>
      ${p.storyText ? `<div class="txt"><span>${esc(p.storyText)}</span></div>` : ""}
      <div class="taps"><button type="button" data-sprev aria-label="Previous"></button><button type="button" data-snext aria-label="Next"></button></div>
      <div class="ft">${`<button type="button" class="seen" data-sviews="${esc(p.id)}">${I.eye}<span>${fmt(st.views)} views · ${fmt(st.likes)} likes</span></button><span class="sp" style="flex:1"></span><button type="button" data-stext="${esc(p.id)}" style="font-weight:600">New text</button>`}</div>
    </div>`;
    await hydrate($("#full"));
    const bar = $("#full").querySelectorAll(".bar i")[i];
    const vd = $("#full video");
    const dur = vd ? await new Promise(res => { if (vd.readyState >= 1) res(vd.duration); vd.onloadedmetadata = () => res(vd.duration); setTimeout(() => res(15), 1500); }) * 1000 : 5500;
    const t0 = performance.now(), len = Math.min(Math.max(dur || 5500, 3000), 30000);
    const tick = () => { const k = (performance.now() - t0) / len; if (bar) bar.style.width = Math.min(100, k*100) + "%"; if (k < 1) storyRAF = requestAnimationFrame(tick); };
    tick();
    storyTimer = setTimeout(next, len);
  };
  const next = () => { if (i < list.length - 1){ i++; show(); } else if (ai < order.length - 1){ ai++; list = activeStories(order[ai]); i = 0; show(); } else { closeFull(); render(); } };
  const prev = () => { if (i > 0){ i--; show(); } else if (ai > 0){ ai--; list = activeStories(order[ai]); i = list.length - 1; show(); } else show(); };
  $("#full").onclick = async e => {
    const t = e.target.closest("button"); if (!t) return;
    if ("sclose" in t.dataset){ closeFull(); render(); return; }
    if ("snext" in t.dataset) return next();
    if ("sprev" in t.dataset) return prev();
    if (t.dataset.sviews){ const id = t.dataset.sviews; closeFull(); go("#/list/views/"+id); return; }
    if (t.dataset.stext){ const p = S.posts.find(x => x.id === t.dataset.stext); p.storyText = storyText(hashStr(uid("x"))); await savePost(p); show(); }
  };
  show();
}

/* ================= carousel, autoplay, gestures ================= */
function wireCarousels(root){
  for (const c of root.querySelectorAll(".carousel")){
    const sl = c.querySelector(".slides"), cnt = c.querySelector(".count"), dots = c.parentElement.querySelectorAll(".dots i");
    sl.addEventListener("scroll", () => {
      const i = Math.round(sl.scrollLeft / sl.clientWidth);
      if (cnt) cnt.textContent = (i+1)+"/"+sl.children.length;
      dots.forEach((d,k) => d.classList.toggle("on", k===i));
    }, { passive:true });
    let lastTap = 0;
    c.addEventListener("click", e => {
      if (e.target.closest("[data-mute]")) return;
      const t = now();
      if (t - lastTap < 320){ likePost(c.dataset.dbl, true); const b = document.createElement("div"); b.className = "burst"; b.innerHTML = I.heartOn; c.appendChild(b); setTimeout(() => b.remove(), 900); }
      lastTap = t;
    });
  }
}
let feedMuted = true, autoIO = null;
function wireAutoplay(root){
  if (autoIO) autoIO.disconnect();
  autoIO = new IntersectionObserver(es => es.forEach(en => { const v = en.target; if (en.isIntersecting){ v.muted = feedMuted; v.play().catch(()=>{}); } else v.pause(); }), { threshold: .6 });
  root.querySelectorAll("video[data-auto]").forEach(v => autoIO.observe(v));
}
async function likePost(id, force){
  const p = S.posts.find(x => x.id === id); if (!p) return;
  p.liked = force ? true : !p.liked; await savePost(p);
  const el = document.querySelector(`[data-post="${CSS.escape(id)}"]`);
  if (el){ el.outerHTML = postCard(p); const n = document.querySelector(`[data-post="${CSS.escape(id)}"]`); hydrate(n); wireCarousels(n); n.querySelectorAll("video[data-auto]").forEach(v => autoIO && autoIO.observe(v)); }
}

  }
  S.current = (await DB.get("kv","current")) || S.accounts[0].id;
  await saveAccounts();
  const misc = await DB.get("kv","misc") || {};
  S.follows = (misc.follows && !Object.keys(misc.follows).every(k => /^\d+$/.test(k))) ? misc.follows : {};
  S.seenAt = typeof misc.seenAt === "object" && misc.seenAt ? misc.seenAt : {};
  S.saved = misc.saved || {}; S.storySeen = misc.storySeen || {};
  if (navigator.storage?.persist) navigator.storage.persist().catch(()=>{});
  const back = takeOAuthReturn();
  await autoRun();
  render();
  let last = 0; try { last = +localStorage.getItem("reel-synced-at") || 0; } catch(e){}
  let fullPending = false; try { fullPending = localStorage.getItem("reel-full-pending") === "1"; localStorage.removeItem("reel-full-pending"); } catch(e){}
  if (back && fullPending) sync(false, true);
  else if (back || now() - last > 20*60e3) sync(true);
  setInterval(() => sync(true), 30*60e3);
  setInterval(() => autoStories(), 30*60e3);
  setInterval(writerRun, 4*60e3);
  document.addEventListener("visibilitychange", () => { let l = 0; try { l = +localStorage.getItem("reel-synced-at") || 0; } catch(e){} if (document.visibilityState === "visible"){ autoStories().then(render); if (now() - l > 20*60e3) sync(true); } });
  setInterval(() => { const r = route().name; if (["home","me","activity"].includes(r) && !$("#layer").innerHTML && !$("#full").innerHTML && document.activeElement?.tagName !== "INPUT" && document.activeElement?.tagName !== "TEXTAREA") render(); }, 60e3);
  if ("serviceWorker" in navigator && location.protocol === "https:") navigator.serviceWorker.register("sw.js").catch(()=>{});
})();
</script>
