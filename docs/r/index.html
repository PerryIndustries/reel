:root{
  --bg:#ffffff; --fg:#181c1f; --muted:#576f76; --line:#e5ebee; --soft:#f2f5f6; --card:#ffffff;
  --accent:#d93a00; --accent-fg:#ffffff; --up:#d93a00; --down:#6a5cff; --link:#0a449b; --heart:#ff3040; --join:#0045ac;

}
@media (prefers-color-scheme: dark){:root{
  --bg:#0e1113; --fg:#eef1f3; --muted:#8ba2ad; --line:#262d31; --soft:#181c1f; --card:#0e1113;

.top .row{height:52px}
.logo-mark{width:30px;height:30px;flex:none}
.hometitle{display:flex;align-items:center;gap:4px;font:700 18px var(--display)}
.hometitle svg{width:18px;height:18px}

.sorts{display:flex;gap:8px;padding:10px 16px;overflow-x:auto;scrollbar-width:none}
.sorts::-webkit-scrollbar{display:none}
.chip{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:7px 14px;background:var(--soft);font-weight:600;font-size:14px;flex:none;white-space:nowrap}
.chip.on{background:var(--fg);color:var(--bg)}
.chip svg{width:16px;height:16px}
/* post card */
.post{border-bottom:1px solid var(--line);padding:10px 0 8px;background:var(--card)}
.phead{display:flex;align-items:center;gap:8px;padding-bottom:8px}
.phead .who{flex:1;min-width:0;line-height:1.25}
.phead .who b{font-weight:700;font-size:13px}
.phead .who .small{font-size:12px}
.subav{width:32px;height:32px;border-radius:50%;display:inline-grid;place-items:center;font-size:17px;flex:none;color:#fff}
.subav.s24{width:24px;height:24px;font-size:13px}
.subav.s62{width:62px;height:62px;font-size:32px;border:3px solid var(--bg)}
.join{background:var(--join);color:#fff;border-radius:999px;padding:6px 14px;font-weight:700;font-size:13px}
.join.on{background:var(--soft);color:var(--fg)}
.title{margin:0 0 8px;font:600 17px/1.3 var(--display);overflow-wrap:anywhere}
.flairs{display:flex;gap:6px;flex-wrap:wrap;padding-bottom:8px}
.flair{font-size:12px;font-weight:600;border-radius:999px;padding:2px 8px;background:var(--soft)}
.flair.nsfw{background:var(--accent);color:#fff}
.media{position:relative;margin:0 16px;border-radius:14px;overflow:hidden;background:#0d0d0d}
.media .pic{aspect-ratio:var(--ar,4/5);max-height:70vh;width:100%;background:#0d0d0d}
.media .pic img,.media .pic video{object-fit:contain;background:#0d0d0d}
.gallery{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none}
.gallery::-webkit-scrollbar{display:none}
.gallery .pic{flex:0 0 100%;scroll-snap-align:center;aspect-ratio:var(--gar,4/5);max-height:70vh}
.media .count{position:absolute;top:10px;right:10px;background:rgba(0,0,0,.65);color:#fff;font-size:12px;font-weight:700;padding:3px 9px;border-radius:999px;z-index:2}
.media .dots{position:absolute;bottom:8px;left:0;right:0;display:flex;justify-content:center;gap:4px;z-index:2}
.media .dots i{width:6px;height:6px;border-radius:50%;background:rgba(255,255,255,.45)}
.media .dots i.on{background:#fff}
.pbar{display:flex;gap:8px;padding-top:10px;align-items:center}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;background:var(--soft);padding:6px 10px;font-weight:700;font-size:13px;height:34px}
.pill svg{width:20px;height:20px}
.pill.vote{padding:0 4px}
.pill.vote button{width:30px;height:34px;display:grid;place-items:center}
.pill.vote.up{background:var(--up);color:#fff}
.pill.vote.down{background:var(--down);color:#fff}
.pill.vote b{min-width:22px;text-align:center}
.pill .spin{flex:1}
.pbar .sp{flex:1}
.pbar .pill.saved{color:var(--accent)}
.crosspost{font-size:12px;color:var(--muted);padding:8px 16px 0;display:flex;gap:6px;flex-wrap:wrap}
.crosspost a{color:var(--link);font-weight:600}
/* comments */
.cmts{padding:4px 12px 90px}
.cmt{position:relative;padding:6px 0 2px;margin-left:calc(var(--d) * 14px)}
.cmt .cline{position:absolute;left:-8px;top:34px;bottom:0;width:14px;cursor:pointer}
.cmt .cline::before{content:"";position:absolute;left:5px;top:0;bottom:4px;width:2px;border-radius:1px;background:var(--line)}
.cmt.collapsed .cline::before{background:var(--muted)}
.cmt .chead{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);line-height:1.2}
.cmt .chead b{color:var(--fg);font-weight:700}
.cmt .chead .op{color:var(--link);font-weight:800;font-size:11px;background:color-mix(in srgb,var(--link) 14%,transparent);padding:1px 5px;border-radius:4px}
.cmt .ctext{padding:5px 0 2px 30px;white-space:pre-wrap;overflow-wrap:anywhere;font-size:14px}
.cmt .cbar{display:flex;align-items:center;gap:4px;padding-left:22px;color:var(--muted);font-size:12px;font-weight:600}
.cmt .cbar button{display:inline-flex;align-items:center;gap:3px;padding:6px 6px;border-radius:999px}
.cmt .cbar svg{width:18px;height:18px}
.cmt .cbar .v.up{color:var(--up)}.cmt .cbar .v.down{color:var(--down)}
.cmt .cbar b{min-width:16px;text-align:center}
.cmt.collapsed .ctext,.cmt.collapsed .cbar,.cmt.collapsed .replies{display:none}
.cmt .more{color:var(--link);font-weight:700;font-size:13px;padding:8px 0 8px 30px;display:flex;align-items:center;gap:6px}
.cmt .more svg{width:16px;height:16px}
.cmt .folded{display:none;color:var(--muted);font-size:12px;padding:0 0 6px 30px}
.cmt.collapsed .folded{display:block}
.loadmore{display:block;width:100%;text-align:center;padding:14px;color:var(--link);font-weight:700}
.reply-to{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted);padding:6px 16px 0}
.reply-to button{color:var(--link);font-weight:700}
.cbox .row{align-items:center}
.cbox input{background:var(--soft)}
/* community */
.banner{height:92px;background:linear-gradient(120deg,hsl(var(--h) 70% 45%),hsl(calc(var(--h) + 40) 70% 55%));position:relative}
.banner.photo{background:#000}
.banner.photo img{width:100%;height:100%;object-fit:cover;opacity:.75}
.chead2{display:flex;align-items:flex-end;gap:12px;padding:0 16px;margin-top:-26px;position:relative}
.chead2 .meta{flex:1;min-width:0;padding-bottom:4px}
.chead2 h2{margin:0;font:800 20px var(--display)}
.chead2 .join{margin-bottom:6px}
.cdesc{padding:10px 16px 0;font-size:14px}
.rules{margin:10px 16px 0;border:1px solid var(--line);border-radius:12px;padding:8px 12px}
.rules summary{font-weight:700;font-size:14px;cursor:pointer}
.rules ol{margin:6px 0 2px;padding-left:20px;font-size:13px;color:var(--muted)}
.crow{display:flex;align-items:center;gap:12px;padding:10px 16px;width:100%}
.crow .who{flex:1;min-width:0}
.crow .who b{font-size:15px}
.crow .who div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* profile */
.prof{padding:14px 16px 0;display:flex;gap:14px;align-items:center}
.prof .meta{flex:1;min-width:0}
.prof h2{margin:0;font:800 20px var(--display)}
.pstats{display:flex;gap:18px;padding:12px 16px 0}
.pstats div{display:flex;flex-direction:column}
.pstats b{font-size:16px}
.pstats span{font-size:12px;color:var(--muted)}
.ptabs{display:grid;grid-template-columns:repeat(2,1fr);margin-top:12px;border-bottom:1px solid var(--line)}
.ptabs button{padding:12px;text-align:center;font-weight:700;color:var(--muted);border-bottom:3px solid transparent;margin-bottom:-1px}
.ptabs button.on{color:var(--fg);border-bottom-color:var(--accent)}
.astrip{display:flex;gap:14px;overflow-x:auto;padding:10px 16px;scrollbar-width:none;border-bottom:1px solid var(--line)}
.astrip::-webkit-scrollbar{display:none}
.astrip button{display:flex;flex-direction:column;align-items:center;gap:4px;width:64px;flex:none;font-size:12px}
.astrip .ring{padding:2px;border:2px solid transparent;border-radius:50%}
.astrip .on .ring{border-color:var(--accent)}
.astrip .n{max-width:64px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.astrip .on .n{font-weight:700}
.mycmt{padding:12px 16px;border-bottom:1px solid var(--line);display:block}
.mycmt .ctx{font-size:12px;color:var(--muted);margin-bottom:4px}
.mycmt .ctx b{color:var(--fg)}
/* inbox */
.note{display:flex;gap:12px;padding:12px 16px;border-bottom:1px solid var(--line);align-items:flex-start}
.note.un{background:color-mix(in srgb,var(--link) 7%,transparent)}
.note .t{flex:1;min-width:0;font-size:14px;overflow-wrap:anywhere}
.note .t .q{color:var(--muted);display:block;margin-top:2px;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.note .th{width:44px;height:44px;border-radius:6px;overflow:hidden;background:var(--soft);flex:none}
.note .th img{width:100%;height:100%;object-fit:cover}
.badge{display:inline-grid;place-items:center;width:40px;height:40px;border-radius:50%;background:var(--soft);flex:none;font-size:18px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:10px 16px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chips .chip{padding:5px 12px 5px 5px}
.chips .cnt{background:var(--accent);color:#fff;font-size:11px;line-height:16px;min-width:16px;padding:0 4px;border-radius:999px;text-align:center}
.caught{text-align:center;padding:22px 16px 18px;border-top:1px solid var(--line)}
</style>
</head>

      <button class="btn" type="button" data-addsub>Add a community</button>
      ${S.settings.subs ? `<button class="btn" type="button" data-resetsubs>Back to the built-in list</button>` : ""}</div>
    <div class="card"><h3>Writer</h3><div class="hint">Ollama on your PC writes the titles, comments and her replies, with the address and style Reel uses. When the PC is off, the built-in lines fill in.</div><div class="status" data-wstatus>${esc(writerLine())}</div>${PC() ? `<div class="hint">PC style version ${esc(String(PC().ver))}.</div>` : ""}<button class="btn" type="button" data-rewrite>Rewrite every post</button></div>
    <div class="card"><h3>Storage</h3><div class="hint" id="sstore">Checking…</div><button class="btn danger" type="button" data-reset>Erase everything Thread made on this phone</button><div class="hint">Reel's photos and accounts are never touched.</div></div>
    <div class="hint ver">Thread version ${APP_VERSION}</div>
  </div>`;
  if (navigator.storage?.estimate) navigator.storage.estimate().then(e => { const el = $("#sstore"); if (el) el.textContent = `${(e.usage/1048576).toFixed(0)} MB used on this phone (shared with Reel). ${S.posts.length} posts across ${LIB.accounts.length} ${LIB.accounts.length === 1 ? "account" : "accounts"}.`; });
};
function editSub(name){
  const s = name ? subs().find(x => x.name === name) : { name: "", title: "", desc: "", members: 120000, hue: Math.floor(Math.random()*360), icon: "🔥", rules: [], flairs: [] };
  if (!s) return;
  sheet(`<h3>${name ? "r/" + esc(name) : "New community"}</h3>
    <div class="form" style="padding-top:6px">
      <div class="field"><label for="sn">Name (after r/)</label><input type="text" id="sn" value="${esc(s.name)}" autocapitalize="off" autocorrect="off"></div>
      <div class="field"><label for="st">Title</label><input type="text" id="st" value="${esc(s.title)}"></div>
      <div class="field"><label for="sd">Description</label><textarea id="sd">${esc(s.desc)}</textarea></div>
      <div class="field"><label for="sm">Members</label><input type="number" id="sm" inputmode="numeric" value="${esc(s.members)}"></div>
      <div class="field"><label for="si">Icon (an emoji)</label><input type="text" id="si" value="${esc(s.icon || "")}"></div>
      <div class="field"><label for="sf">Flairs, one per line</label><textarea id="sf">${esc((s.flairs || []).join("\n"))}</textarea></div>
      <div class="field"><label for="sr">Rules, one per line</label><textarea id="sr">${esc((s.rules || []).join("\n"))}</textarea></div>
      <button class="btn primary" type="button" data-savesub="${esc(name || "")}">Save</button>
      ${name ? `<button class="btn danger" type="button" data-delsub="${esc(name)}">Remove r/${esc(name)}</button>` : ""}
    </div>`, async el => {
      const b = el.closest("[data-savesub],[data-delsub]"); if (!b) return;
      const list = subs().map(x => ({ ...x }));
      if (b.dataset.delsub !== undefined){ if (list.length <= 1){ toast("Keep at least one community"); return; } S.settings.subs = list.filter(x => x.name !== b.dataset.delsub); }
      else {
        const nn = $("#sn").value.trim().replace(/^r\//, "").replace(/\s+/g, ""); if (!nn){ toast("Give it a name"); return; }
        const next = { ...s, name: nn, title: $("#st").value.trim() || nn, desc: $("#sd").value.trim(), members: Math.max(10, Math.round(+$("#sm").value || 0)), icon: $("#si").value.trim().slice(0, 4) || "🔥", flairs: $("#sf").value.split("\n").map(x => x.trim()).filter(Boolean), rules: $("#sr").value.split("\n").map(x => x.trim()).filter(Boolean) };
        const i = list.findIndex(x => x.name === b.dataset.savesub);
        if (i >= 0) list[i] = next; else list.push(next);
        if (b.dataset.savesub && b.dataset.savesub !== nn) for (const p of S.posts) if (p.subs){ p.subs = p.subs.map(x => x === b.dataset.savesub ? nn : x); await savePost(p); }
        S.settings.subs = list;
      }
      await saveSettings(); closeSheet(); toast("Saved"); render();
    });
}
function postMenu(id){
  const p = S.posts.find(x => x.id === id); if (!p) return;
  sheet(`<button class="opt" data-o="save">${p.saved ? I.saveOn : I.save} ${p.saved ? "Unsave" : "Save"}</button>
    <button class="opt" data-o="reveal">${I.eyeOff} ${revealed.has(p.id) || !blurOn() ? "Photo is shown" : "Show the photo"}</button>
    <button class="opt" data-o="retitle">${I.neww} New title</button>
    ${p.publishAt > now() ? `<button class="opt" data-o="now">${I.up} Post now</button>` : ""}
    <button class="opt red" data-o="del">${I.dots} Take down</button>`, async el => {
      const b = el.closest("[data-o]"); if (!b) return; const o = b.dataset.o;
      if (o === "del"){ if (b.dataset.armed !== "1"){ b.dataset.armed = "1"; b.textContent = "Tap again to take it down"; return; } closeSheet(); await delPost(p); toast("Taken down. Its photos come back later."); if (route().name === "p") history.back(); else render(); return; }
      closeSheet();
      if (o === "save"){ p.saved = !p.saved; await savePost(p); toast(p.saved ? "Saved" : "Removed from saved"); render(); }
      if (o === "reveal"){ revealed.add(p.id); render(); }
      if (o === "retitle"){ p.textTry = (p.textTry || 0) + 1; p.text = ""; p.textWritten = !ollamaURL(); await savePost(p); toast(ollamaURL() ? "Writing a new title" : "New title"); writerRun(); render(); }
      if (o === "now"){ p.publishAt = now(); await savePost(p); toast("Posted"); render(); }
    });
}
APP.onClick = async (t, d) => {
  if (d.tab === "home"){ if (route().name !== "home") go("#/"); refreshFeed(); return; }
  if (d.tab === "chat"){ go("#/chat/" + (ownAccts().find(a => dmUnreadCount(a)) || A()).id); return; }
  if (d.tab){ go("#/" + d.tab); return; }
  if (d.sortsheet){ sheet(`<h3>Sort posts by</h3>${SORTS.map(([k,l,ic]) => `<button class="opt" data-s="${k}">${ic} ${l}${d.sortsheet === k ? " ✓" : ""}</button>`).join("")}`, el => { const b = el.closest("[data-s]"); if (!b) return; closeSheet(); go("#/home/" + b.dataset.s); }); return; }
  if (d.csort){ sheet(`<h3>Sort comments by</h3>${[["best","Best"],["top","Top"],["new","New"]].map(([k,l]) => `<button class="opt" data-s="${k}">${l}${d.csort === k ? " ✓" : ""}</button>`).join("")}`, el => { const b = el.closest("[data-s]"); if (!b) return; closeSheet(); location.replace(`#/p/${d.p}/${b.dataset.s}`); render(); }); return; }
  if (d.vote !== undefined && d.p){ const p = S.posts.find(x => x.id === d.p); if (!p) return; const v = +d.vote; p.vote = p.vote === v ? 0 : v; p.kept = true; await savePost(p); const el = document.querySelector(`[data-post="${CSS.escape(p.id)}"]`); if (el){ el.outerHTML = postCard(p, route().name === "c" ? { sub: route().a } : {}); const n = document.querySelector(`[data-post="${CSS.escape(p.id)}"]`); hydrate(n); wireGalleries(n); } return; }
  if (d.save){ const p = S.posts.find(x => x.id === d.save); if (!p) return; p.saved = !p.saved; await savePost(p); t.classList.toggle("saved", p.saved); t.innerHTML = p.saved ? I.saveOn : I.save; toast(p.saved ? "Saved" : "Removed from saved"); return; }
  if ("share" in d){ toast("Link copied"); return; }
  if (d.join){ (S.misc.joined ||= {})[d.join] = !joined(d.join); await saveMisc(); toast(joined(d.join) ? `Joined r/${d.join}` : `Left r/${d.join}`); render(); return; }
  if (d.postmenu){ postMenu(d.postmenu); return; }
  if (d.editsub !== undefined){ editSub(d.editsub); return; }
  if ("addsub" in d){ editSub(""); return; }
  if ("resetsubs" in d){ delete S.settings.subs; await saveSettings(); toast("Built-in communities are back"); render(); return; }
  if (d.collapse){ if (collapsed.has(d.collapse)) collapsed.delete(d.collapse); else collapsed.add(d.collapse); const el = document.querySelector(`.cmt[data-cid="${CSS.escape(d.collapse)}"]`); if (el) el.classList.toggle("collapsed", collapsed.has(d.collapse)); return; }
  if (d.expand){ expanded.add(d.expand); render(); return; }
  if (d.loadmore){ shownTop[d.loadmore] = (shownTop[d.loadmore] || 8) + 10; const y = window.scrollY; render(); window.scrollTo(0, y); return; }
  if (d.cvote !== undefined && d.c){ const p = S.posts.find(x => x.id === d.p); if (!p) return; const v = +d.cvote; p.cVotes = { ...(p.cVotes || {}), [d.c]: ((p.cVotes || {})[d.c] === v ? 0 : v) }; p.kept = true; await savePost(p); const y = window.scrollY; render(); window.scrollTo(0, y); return; }
  if (d.cmenu){ const p = S.posts.find(x => x.id === d.p); if (!p) return; const mine = (p.thread || []).find(x => x.id === d.cmenu && x.mine); sheet(`<button class="opt" data-h="hide">${I.eyeOff} ${mine ? "Delete my reply" : "Hide this comment"}</button>`, async el => { if (!el.closest("[data-h]")) return; closeSheet(); if (mine) p.thread = p.thread.filter(x => x.id !== d.cmenu && x.parent !== d.cmenu); else p.hiddenC = [...(p.hiddenC || []), d.cmenu]; treeCache.clear(); await savePost(p); render(); }); return; }
  if (d.reply !== undefined){ replyTo = { p: route().a, id: d.reply, handle: d.handle }; render(); const i = $("#cin"); if (i) i.focus(); return; }
  if ("cancelreply" in d){ replyTo = null; render(); return; }
  if (d.addc){ const i = $("#cin"); const text = i && i.value.trim(); if (!text) return; const p = S.posts.find(x => x.id === d.addc); if (!p) return; const parent = replyTo && replyTo.p === p.id ? replyTo.id : ""; replyTo = null; await ownerReply(p, parent, text); render(); toast("Posted as OP"); return; }
  if (d.follow !== undefined){ followMap()[+d.follow] = !isFollowing(+d.follow); await saveMisc(); render(); return; }
};
boot();
</script>
